# fly.toml — Fly.io deployment configuration for gitlab-mcp-server
#
# Deploy: fly deploy
# Logs:   fly logs
# Status: fly status
# Health: curl https://<app-name>.fly.dev/health
# MCP:    https://<app-name>.fly.dev/
#
# Each user provides their own GitLab token via:
#   - PRIVATE-TOKEN header (Personal Access Token)
#   - Authorization: Bearer header (treated as PAT in legacy mode)
#
# Each user provides their GitLab instance URL via:
#   - GITLAB-URL header (e.g., https://gitlab.com, https://gitlab.example.com)
#
# Auth mode: legacy. OAuth is not enabled here because the OAuth discovery
# endpoints require a public base URL known at startup, and in legacy mode
# each client independently supplies (token, GitLab URL) per request.

app = "gitlab-mcp-server"
primary_region = "cdg"

kill_signal = "SIGTERM"
kill_timeout = 10

[deploy]
  # The release workflow passes --strategy rolling explicitly; declaring it here
  # makes a manual `fly deploy` / `make fly-deploy` behave identically.
  strategy = "rolling"

[build]
  dockerfile = "Dockerfile"
  # No [build.args]: VERSION and COMMIT are supplied by the release workflow via
  # --build-arg. A hardcoded VERSION here goes stale silently and gets compiled
  # into the binary on manual deploys — it was pinned at 2.0.3 long after the
  # project shipped 2.5.x.

# Override Dockerfile CMD for HTTP mode.
# No --gitlab-url: each client provides it via the GITLAB-URL header.
# Auth mode: legacy (per-request PAT + GitLab URL from the client).
# Tool surface omitted intentionally: HTTP mode defaults to dynamic.
# Auto-update disabled: use `fly deploy` with new image tags instead.
[experimental]
  cmd = [
    "--http",
    "--http-addr", "0.0.0.0:8080",
    "--auto-update=false",
    "--trusted-proxy-header", "Fly-Client-IP"
  ]

[env]
  LOG_LEVEL = "info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # 1, not 0: with 0 the last machine can stop entirely, and the next request
  # pays a cold start. Matches what the app actually runs.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

# Sizing. Measured on v2.5.2: the HTTP server idles at ~181 MB RSS before any
# client connects (stdio mode is ~29-30 MB, and the tool surface barely moves
# either number — all three surfaces build the same catalog). A 256mb machine
# was OOM-killed during startup on v2.4.0, which is the floor this must clear.
#
# Headroom above that floor is driven by concurrency, not by the catalog: the
# HTTP pool holds up to --max-http-clients (default 100) entries, each with its
# own MCP server instance, so peak memory scales with distinct token+URL pairs
# rather than with request volume.
#
# This block is the source of truth. `fly deploy --config fly.toml` — which the
# release workflow runs on every tag — resizes running machines to match it, so
# scaling done with `fly scale` alone is reverted on the next release unless it
# is mirrored here.
[[vm]]
  size = "shared-cpu-8x"
  cpu_kind = "shared"
  cpus = 8
  memory = "10gb"
  processes = ["app"]
