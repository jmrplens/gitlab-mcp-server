services:
  gitlab-mcp-server:
    # Pin VERSION to a specific release (e.g., 1.7.7) in production; avoid :latest
    image: ${DOCKER_REGISTRY:-ghcr.io/jmrplens/gitlab-mcp-server}:${VERSION:-latest}
    pull_policy: always
    ports:
      - "8080:8080"
    environment:
      - GITLAB_URL=${GITLAB_URL:-}
      - GITLAB_SKIP_TLS_VERIFY=${GITLAB_SKIP_TLS_VERIFY:-false}
      - TOOL_SURFACE=${TOOL_SURFACE:-dynamic}
      - GITLAB_TIER=${GITLAB_TIER:-}
      - GITLAB_READ_ONLY=${GITLAB_READ_ONLY:-false}
      - GITLAB_SAFE_MODE=${GITLAB_SAFE_MODE:-false}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    command:
      - "--http"
      - "--http-addr=0.0.0.0:8080"
      # Required: a deployment naming no instance would make requests to
      # whatever host a caller puts in GITLAB-URL, with that caller's token,
      # so the server refuses to start. Set GITLAB_URL in .env, or list
      # several comma-separated and let the GITLAB-URL header select among them.
      - "--gitlab-url=${GITLAB_URL:?set GITLAB_URL in .env: the server refuses to start without an instance allow-list}"
      - "--tool-surface=${TOOL_SURFACE:-dynamic}"
      - "--tier=${GITLAB_TIER:-}"
      - "--skip-tls-verify=${GITLAB_SKIP_TLS_VERIFY:-false}"
      - "--read-only=${GITLAB_READ_ONLY:-false}"
      - "--safe-mode=${GITLAB_SAFE_MODE:-false}"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 64M
    restart: unless-stopped
    # Security hardening (least privilege, OWASP Docker security)
    read_only: true
    tmpfs:
      - /tmp:rw,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
