# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# GoReleaser configuration for gitlab-mcp-server.
# Docs: https://goreleaser.com
version: 2

before:
  hooks:
    - go mod download

builds:
  - id: gitlab-mcp-server
    main: ./cmd/server
    binary: gitlab-mcp-server
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildmode=pie
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}
    # Reproducible builds: stamp binary mtime from commit timestamp.
    mod_timestamp: "{{ .CommitTimestamp }}"

# macOS universal (fat) binary for the Claude Desktop extension (.mcpb):
# platform_overrides in the MCPB manifest key by OS only (darwin/win32), not
# by architecture, so the darwin entry point must run on both arm64 and amd64.
# replace: false keeps the per-arch darwin assets that the Homebrew formula
# and the installers look up by exact name.
universal_binaries:
  - id: gitlab-mcp-server-universal
    ids: [gitlab-mcp-server]
    name_template: gitlab-mcp-server
    replace: false
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: binaries
    formats: [ binary ]
    name_template: "{{ .Binary }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt

snapshot:
  # A release rehearsal (release.yml on workflow_dispatch) builds the
  # dispatched tree under the version its tag input names, and the npm, PyPI
  # and NuGet validators downstream compare the binary's own version with the
  # one the packages carry, so a snapshot there has to answer with that
  # version and nothing appended. Anywhere else a snapshot keeps GoReleaser's
  # naming.
  version_template: '{{ if index .Env "RELEASE_TAG" }}{{ trimprefix .Env.RELEASE_TAG "v" }}{{ else }}{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}{{ end }}'

changelog:
  use: github
  sort: asc
  groups:
    - title: "✨ Features"
      regexp: "^.*?feat(\\(.+?\\))??!?:.+$"
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: "^.*?fix(\\(.+?\\))??!?:.+$"
      order: 1
    - title: "🔒 Security"
      regexp: "^.*?(sec|security)(\\(.+?\\))??!?:.+$"
      order: 2
    - title: "⚡ Performance"
      regexp: "^.*?perf(\\(.+?\\))??!?:.+$"
      order: 3
    - title: "📚 Documentation"
      regexp: "^.*?docs(\\(.+?\\))??!?:.+$"
      order: 4
    - title: "🚧 Maintenance"
      order: 999
  filters:
    exclude:
      - "^test:"
      - "(?i)typo"
      - "^Merge pull request"
      - "^Merge branch"

signs:
  # Cosign sigstore-bundle (single-file format with cert + signature).
  # Verify with: cosign verify-blob --bundle <file>.sigstore.json <file>
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    output: true
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}

sboms:
  # `binary`, not `archive`: binary-format archives produce Binary-type
  # artifacts, which the archive filter never matches — with `archive` here
  # GoReleaser logs "no artifacts matching current filters" and no SBOM ships.
  - artifacts: binary
    documents:
      - "{{ .ArtifactName }}.sbom.json"
    cmd: syft
    args:
      - scan
      - ${artifact}
      - --output
      - spdx-json=${document}
      - --enrich
      - all

release:
  github:
    owner: jmrplens
    name: gitlab-mcp-server
  # Draft first: every asset (binaries, checksums.txt + signature, SBOMs, and
  # the .mcpb attached by the workflow) is in place before the release becomes
  # visible, so no installer or updater observes a partial release. The workflow's
  # "Publish release" step flips the draft after the last upload.
  draft: true
  replace_existing_draft: true
  prerelease: auto
  name_template: "v{{.Version}}"
  footer: |
    ---

    **Full changelog**: https://github.com/jmrplens/gitlab-mcp-server/compare/{{ .PreviousTag }}...{{ .Tag }}

    ### Verify the assets

    All binaries are listed in `checksums.txt`, signed keylessly with cosign:

    ```console
    cosign verify-blob \
      --bundle checksums.txt.sigstore.json \
      --certificate-identity "https://github.com/jmrplens/gitlab-mcp-server/.github/workflows/release.yml@refs/tags/{{ .Tag }}" \
      --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
      checksums.txt
    sha256sum --check --ignore-missing checksums.txt
    ```
