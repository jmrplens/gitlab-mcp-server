# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# GoReleaser configuration for gitlab-mcp-server.
# Docs: https://goreleaser.com
version: 2

before:
  hooks:
    - go mod download

builds:
  - id: gitlab-mcp-server
    main: ./cmd/server
    binary: gitlab-mcp-server
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildmode=pie
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}
    # Reproducible builds: stamp binary mtime from commit timestamp.
    mod_timestamp: "{{ .CommitTimestamp }}"

# macOS universal (fat) binary for the Claude Desktop extension (.mcpb):
# platform_overrides in the MCPB manifest key by OS only (darwin/win32), not
# by architecture, so the darwin entry point must run on both arm64 and amd64.
# replace: false keeps the per-arch darwin assets that go-selfupdate matches
# by exact name.
universal_binaries:
  - id: gitlab-mcp-server-universal
    ids: [gitlab-mcp-server]
    name_template: gitlab-mcp-server
    replace: false
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: binaries
    formats: [ binary ]
    name_template: "{{ .Binary }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  groups:
    - title: "✨ Features"
      regexp: "^.*?feat(\\(.+?\\))??!?:.+$"
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: "^.*?fix(\\(.+?\\))??!?:.+$"
      order: 1
    - title: "🔒 Security"
      regexp: "^.*?(sec|security)(\\(.+?\\))??!?:.+$"
      order: 2
    - title: "⚡ Performance"
      regexp: "^.*?perf(\\(.+?\\))??!?:.+$"
      order: 3
    - title: "📚 Documentation"
      regexp: "^.*?docs(\\(.+?\\))??!?:.+$"
      order: 4
    - title: "🚧 Maintenance"
      order: 999
  filters:
    exclude:
      - "^test:"
      - "(?i)typo"
      - "^Merge pull request"
      - "^Merge branch"

signs:
  # Cosign sigstore-bundle (single-file format with cert + signature).
  # Verify with: cosign verify-blob --bundle <file>.sigstore.json <file>
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    output: true
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}

sboms:
  - artifacts: archive
    cmd: syft
    args:
      - scan
      - ${artifact}
      - --output
      - spdx-json=${document}
      - --enrich
      - all

release:
  github:
    owner: jmrplens
    name: gitlab-mcp-server
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
