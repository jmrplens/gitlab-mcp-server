services:
  gitlab:
    image: ${GITLAB_IMAGE:-gitlab/gitlab-ce:latest}
    hostname: gitlab-e2e
    ports:
      - "8929:80"
      - "5050:5050"
    environment:
      GITLAB_ACTIVATION_CODE: ${GITLAB_ACTIVATION_CODE:-}
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8929'
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        gitlab_rails['monitoring_whitelist'] = ['0.0.0.0/0', '::/0']
        gitlab_rails['initial_root_password'] = 'E2e_R0ot!xK9mZ#2026'
        # Performance: handle ~40 parallel project creations without connection resets
        puma['workers'] = 4
        puma['min_threads'] = 4
        puma['max_threads'] = 8
        sidekiq['concurrency'] = 10
        postgresql['shared_buffers'] = '512MB'
        nginx['worker_connections'] = 2048
        nginx['proxy_connect_timeout'] = '120'
        nginx['proxy_read_timeout'] = '120'
        nginx['keepalive_timeout'] = '120'
        prometheus_monitoring['enable'] = false
        alertmanager['enable'] = false
        # Disable unnecessary services
        gitlab_kas['enable'] = false
        sentinel['enable'] = false
        # Container registry (a CE/Free feature) enabled over plain HTTP on a
        # dedicated port so the registry tag protection rules API
        # (gitlab_registry_tag_protection_*) can be exercised end-to-end instead
        # of skipped. The protection-rules API is DB-backed and does not require
        # pushing images, so no TLS or client access to :5050 is needed.
        registry_external_url 'http://localhost:5050'
        registry['enable'] = true
        gitlab_rails['registry_enabled'] = true
        registry_nginx['listen_port'] = 5050
        registry_nginx['listen_https'] = false
        # GitLab Pages enabled so the pages_* project actions (settings
        # update, domain lifecycle, unpublish) can be exercised end-to-end.
        # Only the API and the CI artifact deployment path are needed — the
        # pages sites themselves are never fetched, so no extra port is
        # published and access control stays off.
        pages_external_url 'http://pages.gitlab.localhost'
        gitlab_pages['enable'] = true
        gitlab_rails['pages_access_control'] = false
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    shm_size: '512m'
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/-/readiness?all=1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s

  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    depends_on:
      gitlab:
        condition: service_healthy
    volumes:
      - runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # e2e-ldap provides an OpenLDAP server for the groupldap_ee test.
  # The default osixia/openldap image seeds a minimal directory
  # (ou=people, ou=groups) under dc=example,dc=com at first start;
  # GitLab's LDAP group-links can then bind as
  # cn=admin,dc=example,dc=com. The password is sourced from
  # E2E_LDAP_ADMIN_PASSWORD (default "ldapadmin" for the local
  # fixture). The test user and group are simple fixture data
  # used by the suite; the suite does not modify them.
  e2e-ldap:
    image: osixia/openldap:1.5.0
    hostname: ldap-e2e
    container_name: e2e-ldap
    environment:
      LDAP_ORGANISATION: "E2E"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_USERNAME: "admin"
      LDAP_ADMIN_PASSWORD: ${E2E_LDAP_ADMIN_PASSWORD:-ldapadmin}
      LDAP_CONFIG_PASSWORD: ${E2E_LDAP_CONFIG_PASSWORD:-config}
      LDAP_READONLY_USER: "false"
      LDAP_RFC2307BIS_SCHEMA: "true"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "true"
      LDAP_SSL_HELPER_PREFIX: "ldap"
      LDAP_TLS: "false"
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -b dc=example,dc=com -D \"cn=admin,dc=example,dc=com\" -w ${E2E_LDAP_ADMIN_PASSWORD:-ldapadmin} \"(objectclass=*)\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # e2e-bitbucket provides a real self-hosted Bitbucket Data Center for the
  # import_bitbucket_server e2e coverage (profile "bitbucket", enabled by the
  # CE docker target). Unattended setup is driven by bitbucket.properties
  # written before the stock entrypoint runs; the license is Atlassian's
  # public 3-hour timebomb Data Center test license
  # (https://developer.atlassian.com/platform/marketplace/timebomb-licenses-for-testing-server-apps/),
  # which comfortably outlives an ephemeral e2e run. Search is disabled (the
  # importer only needs git + REST) and the embedded eval database is used,
  # so the container stays at one JVM. setup-bitbucket.sh provisions the
  # project/repo/token after boot and appends BITBUCKET_SERVER_* to
  # .env.docker; GitLab reaches it as http://e2e-bitbucket:7990 over the
  # compose network.
  e2e-bitbucket:
    image: atlassian/bitbucket:9.6
    hostname: bitbucket-e2e
    container_name: e2e-bitbucket
    profiles: ["bitbucket"]
    ports:
      - "7990:7990"
    environment:
      SEARCH_ENABLED: "false"
      JVM_MAXIMUM_MEMORY: "1024m"
      BITBUCKET_ADMIN_PASSWORD: ${E2E_BITBUCKET_ADMIN_PASSWORD:-E2e_BB_admin1}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mkdir -p /var/atlassian/application-data/bitbucket/shared
        cat > /var/atlassian/application-data/bitbucket/shared/bitbucket.properties <<PROPS
        setup.displayName=E2E Bitbucket
        setup.baseUrl=http://e2e-bitbucket:7990
        setup.
        setup.sysadmin.username=admin
        setup.sysadmin.password=$${BITBUCKET_ADMIN_PASSWORD}
        setup.sysadmin.displayName=E2E Admin
        setup.sysadmin.emailAddress=admin@example.com
        PROPS
        chown -R 2003:2003 /var/atlassian/application-data/bitbucket
        exec /usr/bin/tini -- /entrypoint.py --log=INFO
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7990/status | grep -q RUNNING"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 90s

  e2e-fixture:
    image: nginx:alpine
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'NGINX'
        server {
          listen 8080;
          location = /hook { add_header Content-Type application/json; return 200 '{"ok":true,"endpoint":"hook"}\n'; }
          location = /hook-updated { add_header Content-Type application/json; return 200 '{"ok":true,"endpoint":"hook-updated"}\n'; }
          location = /group-hook { add_header Content-Type application/json; return 200 '{"ok":true,"endpoint":"group-hook"}\n'; }
          location = /system-hook { add_header Content-Type application/json; return 200 '{"ok":true,"endpoint":"system-hook"}\n'; }
          location = /jira { add_header Content-Type application/json; return 200 '{"ok":true,"endpoint":"jira"}\n'; }
          location = /emoji.png { root /usr/share/nginx/html; add_header Content-Type image/png; }
        }
        NGINX
        printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/p9sAAAAASUVORK5CYII=' | base64 -d > /usr/share/nginx/html/emoji.png
        nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/emoji.png"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
  runner-config:
