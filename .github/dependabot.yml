# Dependabot configuration — gitlab-mcp-server
# Docs: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
#
# Every ecosystem states its own cooldown. GitHub has applied a three-day
# default since July 2026, but a default is a property of the platform, not of
# this repository: it can be changed, and an absent key would then mean
# something different without anything here changing. A week is long enough for
# a compromised release to be yanked (the September 2025 npm maintainer
# phishing that hit `debug`, `chalk` and 16 other packages was caught in
# hours), and security updates ignore cooldown entirely, so this delays
# convenience, not fixes.
#
# The root docker-compose.yml names this project's own image by a variable
# tag, which Dependabot cannot resolve and so never proposes; it states the
# window anyway, because examples/telemetry/compose.yaml pins third-party
# images that do move, and one rule for the ecosystem is what
# cmd/audit_supply_chain holds both entries to.
#
# Two deliberate omissions:
#   * SemVer sub-keys are left off every docker and docker-compose entry:
#     Dependabot scopes them to SemVer-aware managers and rejects the whole
#     configuration otherwise, which would stop that ecosystem's updates
#     completely.
#   * npm/gitlab-mcp-server, the published launcher, has no entry on purpose.
#     Its only dependencies are the per-platform packages, pinned to the exact
#     release version by scripts/update-server-json-sha.sh; a Dependabot bump
#     there would fight the release stamp and desynchronise the launcher from
#     the binaries it resolves.

version: 2

updates:
  # Go modules (root go.mod)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "go"
    groups:
      go-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10

  # pnpm / Astro docs site (site/package.json)
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  # The tools release.yml's pypi job installs beside its OIDC token
  # (.github/requirements: pypi-publish.in and the hash-pinned lock compiled
  # from it). Dependabot recompiles the lock with the pip-compile command its
  # header names, so every hash stays the one of the file it pins.
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "distribution"
    groups:
      pypi-publish:
        applies-to: version-updates
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Madrid"
    # No SemVer sub-keys: an action pin is a commit SHA with a version comment,
    # and the cooldown that matters is the flat one before a hijacked tag is
    # adopted.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-all:
        applies-to: version-updates
        patterns:
          - "*"

  # Docker (root Dockerfile)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  # Docker Compose (root docker-compose.yml)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  # Docker Compose for the worked telemetry example (examples/telemetry/compose.yaml),
  # which pins the collector and the otel-lgtm backend a reader runs. This entry
  # moves otel-lgtm. The collector is ignored: its tag has to equal
  # collectorImage in test/e2e/collector/collector_test.go, a Go constant
  # Dependabot never edits, and the collector module that holds the two equal
  # runs weekly and at release, never on a pull request, so a bump of the
  # compose file alone would merge green and stop the next release. The
  # collector moves by hand, in the same diff as collectorImage.
  - package-ecosystem: "docker-compose"
    directory: "/examples/telemetry"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "otel/opentelemetry-collector-contrib"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
