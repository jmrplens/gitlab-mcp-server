name: Enhancement
description: Suggest an improvement to existing functionality
title: "[Enhancement]: "
labels: [ "enhancement", "needs-triage" ]
body:
  - type: checkboxes
    id: prereqs
    attributes:
      label: Prerequisites
      options:
        - label: I have searched [existing
            issues](https://github.com/jmrplens/gitlab-mcp-server/issues?q=is%3Aissue)
            and this enhancement has not been proposed.
          required: true

  # The options are matched by name in .github/workflows/issue-area.yml, which
  # applies the label they pair with; change them there and in the other two
  # templates together.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the server would this touch? It becomes a label, so the work can be found by the same word.
      options:
        - "Not sure"
        - "Transport: stdio or the HTTP server"
        - "Authentication and authorization"
        - "GitLab tools: the API surface"
        - "MCP capabilities: resources, prompts, completions, subscriptions"
        - "Telemetry"
        - "Installation and distribution"
        - "Documentation site"
        - "CI and maintainer tooling"
        - "Platform specific: Windows or macOS"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Brief description of the improvement
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current Behavior
      description: How does the existing feature work today?
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed Enhancement
      description: How should it work after the improvement?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this improvement needed? What's the impact?

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Notes
      description: Technical notes, suggested approach, files to modify, etc.

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Related issues, performance metrics, user feedback, etc.
