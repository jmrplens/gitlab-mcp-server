name: Documentation
description: Report missing, outdated, or incorrect documentation
title: "[Docs]: "
labels: [ "documentation", "needs-triage" ]
body:
  - type: checkboxes
    id: prereqs
    attributes:
      label: Prerequisites
      options:
        - label: I have searched [existing
            issues](https://github.com/jmrplens/gitlab-mcp-server/issues?q=is%3Aissue)
            for this documentation gap.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Brief description of the documentation change needed
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current State
      description: What's wrong, missing, or outdated in the current documentation?
        Name the page by its URL (for example
        https://jmrp.io/docs/gitlab-mcp-server/configuration/) or by its path
        in the repository.
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed Change
      description: What should be added, updated, or removed?

  - type: checkboxes
    id: affected
    attributes:
      label: Affected Documents
      options:
        - label: "User documentation site, English or Spanish
            (`site/src/content/docs/`, the Spanish twin under `es/`)"
        - label: "A generated page of the site (the tool reference by domain,
            fine-grained permissions, the benchmark figures)"
        - label: "`docs/development/` (contributor documentation)"
        - label: "`README.md`"
        - label: "`CONTRIBUTING.md`"

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Links, screenshots, related code changes, etc.
