# Path-based labels applied to pull requests by .github/workflows/labeler.yml.
# Every key must name a label that already exists in the repository, and the
# consequence of getting that wrong is larger than it looks: the action sends
# the whole label set in one PUT, so a single name the repository does not have
# loses the entire call and the pull request gets none of its labels. It is not
# a per-label skip, and it is not silent either. The workflow grants only
# pull-requests: write, under which that call comes back 403; issues: write
# would let the action create the missing label instead, which is deliberately
# not granted, because a label created that way is default grey with no
# description and this repository manages its labels by hand (see CONTRIBUTING).
#
# Five labels, chosen against the real change history rather than against the
# tree, because a rule that fires on nearly every pull request carries no
# information. Every candidate was measured over 43 merged and open pull
# requests first: "touches docs/" was true of 42 of them and "touches
# internal/tools/" of 28, so neither became a label, and no rule that survived
# fires on more than half. GitLab API surface work is the norm here, so an
# unlabeled pull request is the ordinary case rather than a gap in the map.

# --- Kind of change -----------------------------------------------------------

# Documentation *only*, hence any-glob-to-all-files against one braced pattern:
# every changed file has to be prose. The "any file is a doc" form was true of
# 42 of those 43 pull requests, because everything here ships with its
# documentation; the only informative version of this label is the one that
# says no code moved. site/src/content is the published bilingual mirror of
# docs/ and belongs on the same side of that line.
documentation:
  - changed-files:
      - any-glob-to-all-files:
          - "{docs/**,site/src/content/**,README.md,CONTRIBUTING.md,CODE_OF_CONDUCT.md,AGENTS.md,CLAUDE.md,llms*.txt,llms-install.md,.github/copilot-instructions.md,.github/dockerhub-description.md,.github/pull_request_template.md,.github/{agents,instructions,skills,ISSUE_TEMPLATE}/**}"

# Anything where a mistake is a vulnerability rather than a bug: credential
# handling and admission (oauth, serverpool, the HTTP auth gate), the GitLab
# client's TLS, redirect, response-limit and scope handling, the local-path
# allow-lists a tool input is checked against, and the supply-chain controls.
#
# Deliberately over-eager. Whole packages are listed, tests included, so a
# coverage pass over internal/serverpool/ picks the label up without meriting
# it. That is the cheap direction to be wrong in: an extra label costs a glance,
# a missed one costs a security change reviewed as though it were not.
security:
  - changed-files:
      - any-glob-to-any-file:
          - SECURITY.md
          - PRIVACY.md
          - .gitguardian.yaml
          - .github/workflows/codeql.yml
          - .github/scripts/**
          - .github/dependabot.yml
          - cmd/audit_supply_chain/**
          - cmd/server/authgate*.go
          - cmd/server/bearerguard*.go
          - internal/oauth/**
          - internal/serverpool/**
          - internal/gitlab/**
          - internal/capguard/**
          - internal/toolutil/fileutils*.go
          - internal/toolutil/filesource*.go
          - scripts/govulncheck.sh
          - scripts/install.sh
          - scripts/install.ps1

# The pipeline itself, whose failure mode is that nobody finds out until it
# runs. The Makefile is excluded on purpose: it is the entry point for every
# gate in the repository and changes with almost any tooling work, which made
# this label fire on two thirds of pull requests instead of two fifths.
# cmd/audit_*/ is excluded for the same reason: those are Go programs with Go
# tests, reviewed as code, and only the workflow that calls them is pipeline.
ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
          - .github/labeler.yml
          - .github/dependabot.yml
          - .github/scripts/**
          - .golangci.yml
          - .markdownlint-cli2.jsonc
          - .markdownlint-cli2.yaml
          - .coderabbit.yaml
          - sonar-project.properties

# What users install, across seven channels. This label marks the pull requests
# whose mistakes cannot be taken back: a published npm version, a PyPI file
# name and a NuGet version are permanent, an OCI tag and a release asset are
# what an installer resolves, and server.json is what the MCP Registry hands
# to clients.
distribution:
  - changed-files:
      - any-glob-to-any-file:
          - .goreleaser.yml
          - .github/workflows/release.yml
          - Dockerfile
          - .dockerignore
          - docker-compose.yml
          - docker-compose.build.yml
          - VERSION
          - server.json
          - plugin.json
          - .plugin/**
          - lhm.plugin.json
          - mcp.json
          - glama.json
          - mcpb/**
          - npm/**
          - pypi/**
          - nuget/**
          - scripts/build-mcpb.sh
          - scripts/build-npm.mjs
          - scripts/build_pypi.py
          - scripts/build_nuget.py
          - scripts/publish-*
          - scripts/validate-npm.mjs
          - scripts/validate_pypi.py
          - scripts/validate_nuget.py
          - scripts/validate-server-json-packages.sh
          - scripts/check-openplugin.sh
          - scripts/update-homebrew-tap.sh
          - scripts/update-server-json-sha.sh
          - scripts/fetch-release-assets.sh
          - scripts/smoke-test-image.sh
          - scripts/verify_published_packages*.py
          - scripts/install.sh
          - scripts/install.ps1

# The same label .github/dependabot.yml asks for, so a client-go bump made by
# hand and one opened by Dependabot land in the same filter. npm/, pypi/ and
# nuget/ are not here: those manifests are stamped by the release, not resolved.
dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - go.mod
          - go.sum
          - site/package.json
          - site/pnpm-lock.yaml

# --- Area ---------------------------------------------------------------------
#
# Where a change lives, as opposed to what kind of change it is. The same
# discipline as above: each of these was checked against the recent history
# and none fires on more than about a third of pull requests. The GitLab tool
# surface itself, internal/tools/, has no rule for the reason given at the top,
# two thirds of pull requests touch it; its `tools` label exists for the issue
# form's Area dropdown only. The same names are what that dropdown applies, so
# an issue and the pull request that closes it carry the same word.

# The server process and both transports, and the two modules that drive the
# real binary over pipes and sockets. cmd/server holds the flag parsing and
# the HTTP handler chain as well, which is why a change to what a flag means
# lands here rather than nowhere.
transport:
  - changed-files:
      - any-glob-to-any-file:
          - cmd/server/**
          - test/e2e/http/**
          - test/e2e/stdio/**

# Every MCP capability other than tools. Small packages, rarely touched, and
# a change to one is easy to review as if it were a tool change when it is
# not: a prompt runs handler code holding the caller's credential, and a
# subscription is a poller with a lifetime of its own.
mcp:
  - changed-files:
      - any-glob-to-any-file:
          - internal/resources/**
          - internal/prompts/**
          - internal/completions/**
          - internal/subscriptions/**
          - internal/elicitation/**
          - internal/progress/**

telemetry:
  - changed-files:
      - any-glob-to-any-file:
          - internal/telemetry/**
          - internal/mcpotel/**
          - docs/guides/telemetry.md

# The site's machinery, not its content: content is documentation and sits on
# the other side of the docs-only line drawn at the top. A change here is a
# change to how every page is built or rendered.
site:
  - changed-files:
      - any-glob-to-any-file:
          - site/astro.config.mjs
          - site/src/components/**
          - site/src/styles/**
          - site/src/layouts/**
          - site/scripts/**
          - site/public/**
          - site/*.json
          - site/*.mjs
          - site/*.ts
          - .github/workflows/pages.yml

# Maintainer tooling: the auditors, generators and evaluators under cmd/,
# everything there except the server. Reviewed as Go, but with a different
# question in mind: these run on this repository's own checkout from a
# Makefile target, never on a user's machine.
tooling:
  - changed-files:
      - any-glob-to-any-file:
          - cmd/audit_*/**
          - cmd/gen_*/**
          - cmd/bench_resources/**
          - cmd/eval_mcp_surfaces/**
          - cmd/format_md_tables/**
          - cmd/godoc_tool/**
          - cmd/internal/**

# Source that exists for one operating system, and the CI leg that is the
# only place it compiles before a release. A change here has a reviewer
# question the other labels do not raise: was it run on that platform?
platform:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*_windows.go"
          - "**/*_windows_test.go"
          - "**/*_darwin.go"
          - "**/*_darwin_test.go"
          - "**/*_unix.go"
          - "**/*_unix_test.go"
          - scripts/install.ps1

# The suite that needs a GitLab, and the fixtures that stand one up. The
# transport modules are under `transport` instead: they need no GitLab, and
# what they test is the process, not the API surface.
e2e:
  - changed-files:
      - any-glob-to-any-file:
          - test/e2e/suite/**
          - test/e2e/orbit/**
          - test/e2e/collector/**
          - test/e2e/scripts/**
          - test/e2e/docker-compose.yml
          - test/e2e/.env.docker
          - test/fixtures/**
          - .github/workflows/e2e.yml
