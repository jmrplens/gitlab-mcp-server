# Release pipeline for gitlab-mcp-server
#
# Triggers: tag push matching v*
# Pipeline: E2E → GoReleaser → Docker → MCP Registry
# If E2E tests fail, nothing is released.
#
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

env:
  GO_VERSION: "1.27.0"
  REGISTRY: ghcr.io
  IMAGE_NAME: jmrplens/gitlab-mcp-server
  DOCKERHUB_IMAGE: jmrplens/gitlab-mcp-server

jobs:
  e2e:
    name: E2E Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Pull GitLab image
        run: docker pull gitlab/gitlab-ce:latest

      - name: Start GitLab via Docker Compose
        working-directory: test/e2e
        run: |
          docker compose up -d
          echo "GitLab container started — waiting for readiness..."

      - name: Wait for GitLab readiness
        run: bash test/e2e/scripts/wait-for-gitlab.sh
        timeout-minutes: 10

      - name: Setup GitLab user and token
        run: bash test/e2e/scripts/setup-gitlab.sh

      - name: Register GitLab Runner
        run: bash test/e2e/scripts/register-runner.sh

      - name: Load environment
        run: cat test/e2e/.env.docker >> "$GITHUB_ENV"

      - name: Run E2E tests
        run: |
          gotestsum \
            --junitfile test-results/e2e-junit.xml \
            --format standard-verbose \
            -- -v -tags e2e -timeout 1800s -count=1 ./test/e2e/suite/
        env:
          E2E_MODE: "docker"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 14

      - name: Tear down GitLab
        if: always()
        working-directory: test/e2e
        run: docker compose down -v --remove-orphans

  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    environment: release
    needs: [e2e]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: sigstore/cosign-installer@v4.1.2

      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update server.json with SHA256 hashes
        run: bash scripts/update-server-json-sha.sh dist/checksums.txt "${GITHUB_REF#refs/tags/v}"

      - name: Build and upload Claude Desktop extension (.mcpb)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          bash scripts/build-mcpb.sh "${VERSION}"
          sha256sum dist/gitlab-mcp-server.mcpb
          gh release upload "v${VERSION}" dist/gitlab-mcp-server.mcpb --clobber

      - name: Update Homebrew tap formula
        env:
          TAP_DEPLOY_KEY_B64: ${{ secrets.TAP_DEPLOY_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_DEPLOY_KEY_B64}" ]; then
            echo "::warning::TAP_DEPLOY_KEY_B64 secret is not configured — skipping Homebrew tap update"
            exit 0
          fi
          VERSION="${GITHUB_REF#refs/tags/v}"
          KEY_FILE="${RUNNER_TEMP}/tap_deploy_key"
          KNOWN_HOSTS_FILE="${RUNNER_TEMP}/tap_known_hosts"
          echo "${TAP_DEPLOY_KEY_B64}" | base64 --decode > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"
          ssh-keyscan -H github.com > "${KNOWN_HOSTS_FILE}"
          export GIT_SSH_COMMAND="ssh -i ${KEY_FILE} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${KNOWN_HOSTS_FILE}"
          bash scripts/update-homebrew-tap.sh dist/checksums.txt "${VERSION}" "${RUNNER_TEMP}/homebrew-tap"

      - name: Publish to MCP Registry
        env:
          # Pin to a specific version of the mcp-publisher tool for supply-chain integrity.
          # Bump when a new mcp-publisher release is verified. Server version published comes from
          # the git tag (handled in the previous step by update-server-json-sha.sh).
          MCP_PUBLISHER_VERSION: "v1.7.8"
          MCP_PUBLISHER_SHA256: "48230dbec85bd88a0d42977ef533cddda23235f0db4331b9263ce53b432cb75c"
        run: |
          set -euo pipefail
          TARBALL="mcp-publisher_linux_amd64.tar.gz"
          SIGSTORE_BUNDLE="${TARBALL}.sigstore.json"
          URL="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${TARBALL}"
          echo "Downloading ${URL}"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-connrefused -o "${TARBALL}" "${URL}"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-connrefused -o "${SIGSTORE_BUNDLE}" "${URL}.sigstore.json"
          if [ -n "${MCP_PUBLISHER_SHA256}" ]; then
            echo "${MCP_PUBLISHER_SHA256}  ${TARBALL}" | sha256sum -c -
          else
            echo "::warning::MCP_PUBLISHER_SHA256 not set — skipping checksum verification"
          fi
          cosign verify-blob \
            --bundle "${SIGSTORE_BUNDLE}" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${TARBALL}"
          tar xzf "${TARBALL}" mcp-publisher
          ./mcp-publisher login github-oidc
          set +e
          ./mcp-publisher publish 2>&1 | tee mcp-publisher-publish.log
          PUBLISH_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "${PUBLISH_STATUS}" -ne 0 ]; then
            if grep -q "invalid version: cannot publish duplicate version" mcp-publisher-publish.log; then
              echo "::notice::MCP Registry version ${GITHUB_REF#refs/tags/v} is already published; continuing"
            else
              exit "${PUBLISH_STATUS}"
            fi
          fi

      - name: Commit updated server.json and plugin.json to main
        env:
          RELEASE_DEPLOY_KEY_B64: ${{ secrets.RELEASE_DEPLOY_KEY_B64 }}
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ -z "${RELEASE_DEPLOY_KEY_B64}" ]; then
            echo "::error::RELEASE_DEPLOY_KEY_B64 secret is not configured"
            exit 1
          fi

          KEY_FILE="${RUNNER_TEMP}/release_deploy_key"
          KNOWN_HOSTS_FILE="${RUNNER_TEMP}/known_hosts"
          echo "${RELEASE_DEPLOY_KEY_B64}" | base64 --decode > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"
          ssh-keyscan -H github.com > "${KNOWN_HOSTS_FILE}"

          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git config core.sshCommand "ssh -i ${KEY_FILE} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${KNOWN_HOSTS_FILE}"

          git config user.name "José M. Requena Plens"
          git config user.email "jmrplens@gmail.com"

          git fetch origin main
          git checkout main

          # Re-apply updates on top of latest main (the script is idempotent
          # and reads checksums.txt + version, so re-running produces the
          # same result as the artifact built earlier in this job).
          bash scripts/update-server-json-sha.sh dist/checksums.txt "${VERSION}"

          git add server.json
          [ -f .plugin/plugin.json ] && git add .plugin/plugin.json
          [ -f mcpb/manifest.json ] && git add mcpb/manifest.json
          [ -f lhm.plugin.json ] && git add lhm.plugin.json

          if git diff --cached --quiet; then
            echo "::notice::No manifest changes to commit"
            exit 0
          fi

          git commit -m "chore: update manifests for v${VERSION}

          Updates server.json (MCP Registry) with version ${VERSION} and
          pinned SHA256 hashes, and stamps version ${VERSION} into
          .plugin/plugin.json (Open Plugins), mcpb/manifest.json (Claude
          Desktop extension), and lhm.plugin.json (LobeHub Marketplace)."
          git push origin main

  winget:
    name: Winget
    runs-on: windows-latest
    needs: [release]
    steps:
      # Publishes a version-update PR to microsoft/winget-pkgs via the
      # jmrplens/winget-pkgs fork. Only works once the initial package
      # manifest (jmrplens.gitlab-mcp-server) has been merged upstream —
      # continue-on-error keeps releases green until then and if Microsoft's
      # validation service hiccups.
      - uses: vedantmgoyal9/winget-releaser@v2
        continue-on-error: true
        with:
          identifier: jmrplens.gitlab-mcp-server
          installers-regex: '-windows-(amd64|arm64)\.exe$'
          release-tag: ${{ github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [e2e]
    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v4.1.2

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        id: dockerhub-login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set — skipping Docker Hub publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.dockerhub-login.outputs.skip == 'false'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute build date
        id: build-date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        id: docker-push
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.date }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ steps.dockerhub-login.outputs.skip == 'false' && format('docker.io/{0}:{1}', env.DOCKERHUB_IMAGE, steps.version.outputs.version) || '' }}
            ${{ steps.dockerhub-login.outputs.skip == 'false' && format('docker.io/{0}:latest', env.DOCKERHUB_IMAGE) || '' }}

      # Keyless signing reads an OIDC token from the ambient GitHub endpoint,
      # which intermittently answers with a plain-text error body instead of
      # JSON. cosign then fails with "fetching ambient OIDC credentials:
      # invalid character 'u' looking for beginning of value" and takes the
      # whole release down even though the image pushed fine (v2.5.3 failed
      # this way and signed cleanly on a rerun with no code change). Retry
      # before giving up so a blip on that endpoint stops leaving published
      # images unsigned.
      - name: Sign Docker image (ghcr.io)
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.docker-push.outputs.digest }}
        run: bash .github/scripts/cosign-sign-retry.sh "$IMAGE_REF"

      - name: Sign Docker image (Docker Hub)
        if: steps.dockerhub-login.outputs.skip == 'false'
        env:
          IMAGE_REF: docker.io/${{ env.DOCKERHUB_IMAGE }}@${{ steps.docker-push.outputs.digest }}
        run: bash .github/scripts/cosign-sign-retry.sh "$IMAGE_REF"

      # The Docker Hub repository descriptions are owned by this repo so they
      # cannot drift (they had been empty since the repository was published,
      # across thousands of pulls): the short description and the curated
      # description file are re-pushed on every release, right after the
      # image publish. The full README (~33KB) exceeds Docker Hub's 25,000
      # character limit, so .github/dockerhub-description.md carries the
      # Docker-relevant sections verbatim. DOCKERHUB_TOKEN must be a Docker
      # Hub PAT with read/write/delete scope — the descriptions API rejects
      # narrower ones.
      - name: Update Docker Hub description
        if: steps.dockerhub-login.outputs.skip == 'false'
        # Pinned to a commit SHA (unlike the org-owned actions above) because
        # this is an individually-maintained action that receives
        # DOCKERHUB_TOKEN — a mutable tag would let a compromised release
        # exfiltrate it.
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: "MCP server exposing 1,000+ GitLab operations as AI-accessible tools. By jmrp.io"
          readme-filepath: ./.github/dockerhub-description.md
