# Release pipeline for gitlab-mcp-server
#
# Triggers: tag push matching v*
# Pipeline: E2E → Docker → GoReleaser → per-publisher jobs → Winget
# If E2E tests fail, nothing is released.
#
# One job per credential. Until 2.7.5 a single `release` job held the OIDC
# identity that npm, PyPI, cosign, the MCP Registry and the attestation store
# all trust, a write-scoped GITHUB_TOKEN, the Homebrew tap deploy key and the
# main-branch deploy key — and ran code resolved at run time in the middle of
# it. Anything with execution in that job owned every channel this project
# publishes through. Now GoReleaser builds and attests, and each publisher runs
# afterwards in its own job holding only its own permission, fetching the
# published assets and verifying them rather than trusting a directory another
# job left behind.
#
# Invariants that must survive any edit here:
#   * the release stays a draft until every artefact is attached AND attested;
#   * release assets are staged under the exact names dist/artifacts.json gives
#     them, because installers and package managers match names literally;
#   * server.json's OCI entry is stamped with the digest the docker job pushed,
#     never with a tag alone;
#   * npm publishes the platform packages before the launcher that pins them;
#   * the MCP Registry publish runs after npm and after the image push, because
#     it validates both by fetching them.
name: Release

on:
  push:
    tags:
      - "v*"

# Serialize releases: two close tag pushes would otherwise race on the
# main manifest commit, npm publish ordering, and the Homebrew tap push.
# cancel-in-progress stays false — a half-finished release must never be
# killed between GoReleaser and the registry publishes.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Every job declares the minimum it needs; the default is nothing.
permissions: {}

env:
  GO_VERSION: "1.27.1"
  REGISTRY: ghcr.io
  IMAGE_NAME: jmrplens/gitlab-mcp-server
  DOCKERHUB_IMAGE: jmrplens/gitlab-mcp-server
  # Pinned exactly, not by range: goreleaser-action and sbom-action download
  # these binaries at run time into a job that holds the signing identity, so
  # SHA-pinning the action alone leaves the code that actually runs unpinned.
  GORELEASER_VERSION: "v2.18.0"
  SYFT_VERSION: "v1.51.1"

jobs:
  e2e:
    name: E2E Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The docker job tags ghcr.io from VERSION while everything else uses
      # the git tag; server.json pins the OCI tag from the git tag and
      # validate-npm stamps from VERSION. Fail the whole release before
      # anything publishes if the two disagree.
      - name: Verify VERSION file matches the release tag
        run: |
          set -euo pipefail
          FILE_V="$(tr -d '[:space:]' < VERSION)"
          TAG_V="${GITHUB_REF#refs/tags/v}"
          if [ "${FILE_V}" != "${TAG_V}" ]; then
            echo "::error::VERSION file says ${FILE_V} but the tag is v${TAG_V} — the docker job would tag ghcr.io:${FILE_V} while server.json pins ghcr.io/jmrplens/gitlab-mcp-server:${TAG_V}"
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Pull GitLab image
        run: docker pull gitlab/gitlab-ce:latest

      - name: Start GitLab via Docker Compose
        working-directory: test/e2e
        run: |
          docker compose up -d
          echo "GitLab container started — waiting for readiness..."

      - name: Wait for GitLab readiness
        run: bash test/e2e/scripts/wait-for-gitlab.sh
        timeout-minutes: 10

      - name: Setup GitLab user and token
        run: bash test/e2e/scripts/setup-gitlab.sh

      - name: Register GitLab Runner
        run: bash test/e2e/scripts/register-runner.sh

      - name: Load environment
        run: cat test/e2e/.env.docker >> "$GITHUB_ENV"

      - name: Run E2E tests
        run: |
          gotestsum \
            --junitfile test-results/e2e-junit.xml \
            --format standard-verbose \
            -- -v -tags e2e -timeout 1800s -count=1 ./test/e2e/suite/
        env:
          E2E_MODE: "docker"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 14

      - name: Tear down GitLab
        if: always()
        working-directory: test/e2e
        run: docker compose down -v --remove-orphans

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [e2e]
    # No `environment:` — this job never ran under one, and adding it would
    # subject the image publish to whatever protection rules the release
    # environment carries.
    # server.json pins the image by digest, and the stamping jobs read it.
    outputs:
      digest: ${{ steps.docker-push.outputs.digest }}
    permissions:
      contents: read # checkout
      packages: write # ghcr.io push via GITHUB_TOKEN login
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Extract version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        id: dockerhub-login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set — skipping Docker Hub publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.dockerhub-login.outputs.skip == 'false'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute build date
        id: build-date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # Build each platform on its own and RUN it before anything is pushed.
      # The published linux/arm64 image of 2.7.5 could not exec at all — the
      # cross-compiled PIE binary asked for the glibc loader while the runtime
      # image ships only musl's — and nothing in this pipeline could notice,
      # because the multi-platform build was pushed without either variant ever
      # being started. An image never executed on the platform it claims to
      # support is not a tested artefact. `load: true` needs one platform per
      # build; the push below reuses the same layers from the gha cache.
      - name: Build linux/amd64 for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: gitlab-mcp-server:smoke-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.date }}

      - name: Build linux/arm64 for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          platforms: linux/arm64
          tags: gitlab-mcp-server:smoke-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.date }}

      - name: Smoke test both architectures
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/smoke-test-image.sh "${EXPECTED_VERSION}" gitlab-mcp-server:smoke-amd64=linux/amd64 gitlab-mcp-server:smoke-arm64=linux/arm64

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: docker-push
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
          cache-from: type=gha
          # GHCR reads a multi-arch image's package-page description from the
          # INDEX annotations, not from per-manifest Docker LABELs — without
          # these the package page shows no description. The description string
          # is byte-identical to the Dockerfile LABEL; reword both together.
          annotations: |
            index:org.opencontainers.image.title=gitlab-mcp-server
            index:org.opencontainers.image.description=MCP server exposing GitLab REST API v4 and GraphQL operations as Model Context Protocol tools
            index:org.opencontainers.image.source=https://github.com/jmrplens/gitlab-mcp-server
            index:org.opencontainers.image.url=https://github.com/jmrplens/gitlab-mcp-server
            index:org.opencontainers.image.documentation=https://github.com/jmrplens/gitlab-mcp-server/tree/main/docs
            index:org.opencontainers.image.version=${{ steps.version.outputs.version }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.created=${{ steps.build-date.outputs.date }}
            index:org.opencontainers.image.licenses=MIT
            index:org.opencontainers.image.vendor=jmrplens
            index:io.modelcontextprotocol.server.name=io.github.jmrplens/gitlab-mcp-server
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.date }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ steps.dockerhub-login.outputs.skip == 'false' && format('docker.io/{0}:{1}', env.DOCKERHUB_IMAGE, steps.version.outputs.version) || '' }}
            ${{ steps.dockerhub-login.outputs.skip == 'false' && format('docker.io/{0}:latest', env.DOCKERHUB_IMAGE) || '' }}

      # Keyless signing reads an OIDC token from the ambient GitHub endpoint,
      # which intermittently answers with a plain-text error body instead of
      # JSON. cosign then fails with "fetching ambient OIDC credentials:
      # invalid character 'u' looking for beginning of value" and takes the
      # whole release down even though the image pushed fine (v2.5.3 failed
      # this way and signed cleanly on a rerun with no code change). Retry
      # before giving up so a blip on that endpoint stops leaving published
      # images unsigned.
      - name: Sign Docker image (ghcr.io)
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.docker-push.outputs.digest }}
        run: bash .github/scripts/cosign-sign-retry.sh "$IMAGE_REF"

      - name: Sign Docker image (Docker Hub)
        if: steps.dockerhub-login.outputs.skip == 'false'
        env:
          IMAGE_REF: docker.io/${{ env.DOCKERHUB_IMAGE }}@${{ steps.docker-push.outputs.digest }}
        run: bash .github/scripts/cosign-sign-retry.sh "$IMAGE_REF"

      # The Docker Hub repository descriptions are owned by this repo so they
      # cannot drift (they had been empty since the repository was published,
      # across thousands of pulls): the short description and the curated
      # description file are re-pushed on every release, right after the
      # image publish. The full README (~33KB) exceeds Docker Hub's 25,000
      # character limit, so .github/dockerhub-description.md carries the
      # Docker-relevant sections verbatim. DOCKERHUB_TOKEN must be a Docker
      # Hub PAT with read/write/delete scope — the descriptions API rejects
      # narrower ones.
      - name: Update Docker Hub description
        if: steps.dockerhub-login.outputs.skip == 'false'
        # Pinned to a commit SHA (like every other action here) because
        # this is an individually-maintained action that receives
        # DOCKERHUB_TOKEN — a mutable tag would let a compromised release
        # exfiltrate it.
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: "MCP server exposing 1,000+ GitLab operations as AI-accessible tools. By jmrp.io"
          readme-filepath: ./.github/dockerhub-description.md

  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    environment: release
    # docker is a prerequisite because the release is what downstream publishers
    # fetch, and the MCP Registry publish validates the server.json OCI entry by
    # fetching ghcr.io for this version's tag — a tag only the docker job
    # pushes. Racing it 404s the registry publish.
    needs: [e2e, docker]
    permissions:
      contents: write # GoReleaser creates the release; gh uploads/publishes the .mcpb
      id-token: write # cosign keyless signing of checksums.txt
      attestations: write # actions/attest-build-provenance
    steps:
      # persist-credentials: false — this job's GITHUB_TOKEN can rewrite the
      # repository, and nothing here talks to the remote through git. GoReleaser
      # reads its token from the environment instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          # setup-go caches ~/go/pkg/mod and the build cache by default, and a
          # tag run restores what a run on main wrote. This job signs what it
          # compiles, so its inputs must all be fixed by the repository: the
          # modules are downloaded fresh and checked against go.sum instead of
          # coming from an Actions cache no signature covers.
          cache: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Fetched by hand rather than through anchore/sbom-action/download-syft.
      # That action is SHA-pinned, but on Linux it downloads
      # raw.githubusercontent.com/anchore/syft/main/install.sh and runs it with
      # sh, so the code executing in this job came from a branch head. This job
      # mints the release signature and holds the OIDC identity npm, PyPI,
      # cosign and the attestation store trust, which is exactly where nothing
      # may be resolved at run time. The bytes are pinned by SHA256 here;
      # cosign additionally proves they came from anchore's release workflow.
      # Its certificate identity ends in refs/heads/main because syft releases
      # from main rather than from the tag, and the asset is base64-wrapped.
      - name: Install syft
        env:
          SYFT_SHA256: "8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3"
        run: |
          set -euo pipefail
          TARBALL="syft_${SYFT_VERSION#v}_linux_amd64.tar.gz"
          BASE="https://github.com/anchore/syft/releases/download/${SYFT_VERSION}"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-connrefused -o "${TARBALL}" "${BASE}/${TARBALL}"
          echo "${SYFT_SHA256}  ${TARBALL}" | sha256sum -c -
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-connrefused -o checksums.txt "${BASE}/syft_${SYFT_VERSION#v}_checksums.txt"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-connrefused -o checksums.pem "${BASE}/syft_${SYFT_VERSION#v}_checksums.txt.pem"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-connrefused -o checksums.sig "${BASE}/syft_${SYFT_VERSION#v}_checksums.txt.sig"
          base64 -d checksums.pem > checksums.decoded.pem
          cosign verify-blob \
            --certificate checksums.decoded.pem \
            --signature checksums.sig \
            --certificate-identity "https://github.com/anchore/syft/.github/workflows/release.yaml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            checksums.txt
          grep " ${TARBALL}\$" checksums.txt | sha256sum -c -
          tar xzf "${TARBALL}" syft
          install -m 0755 syft /usr/local/bin/syft
          rm -f "${TARBALL}" checksums.txt checksums.pem checksums.decoded.pem checksums.sig syft
          syft --version

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          # Exact, not "~> v2": this binary runs in the job that mints the
          # release's signature. Bump deliberately, and never past v2 — the
          # config is a version: 2 config.
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GoReleaser leaves binaries only in per-target subdirectories
      # (dist/gitlab-mcp-server_linux_amd64_v1/gitlab-mcp-server); the release
      # asset names exist only in dist/artifacts.json. Stage every uploadable
      # binary at the dist root under its exact asset name so the .mcpb builder
      # and the release assets agree on names.
      - name: Stage release-named binaries at dist root
        run: |
          set -euo pipefail
          jq -r '.[] | select(.type == "Binary" and (.name | startswith("gitlab-mcp-server-"))) | [.name, .path] | @tsv' dist/artifacts.json \
            | while IFS=$'\t' read -r name path; do
                cp "$path" "dist/$name"
              done
          ls -1 dist/

      # The bundle is built before the stamp because server.json declares it and
      # needs its SHA256. GoReleaser does not produce it, so it is absent from
      # the signed checksums.txt and its hash cannot be appended there; its
      # integrity comes from the build-provenance attestation below instead.
      - name: Build and upload Claude Desktop extension (.mcpb)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          bash scripts/build-mcpb.sh "${VERSION}"
          sha256sum dist/gitlab-mcp-server.mcpb
          gh release upload "v${VERSION}" dist/gitlab-mcp-server.mcpb --clobber

      # SLSA build provenance for every GoReleaser artifact, keyed by the exact
      # asset names in checksums.txt, plus the .mcpb built outside GoReleaser.
      # Stored in GitHub's attestation store — no release asset changes.
      # Verify: gh attestation verify <file> -R jmrplens/gitlab-mcp-server
      - name: Attest build provenance (release binaries)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-checksums: dist/checksums.txt

      - name: Attest build provenance (Claude Desktop extension)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/gitlab-mcp-server.mcpb

      # Every asset (binaries, checksums.txt + signature, SBOMs, .mcpb) is
      # attached and attested before the release becomes visible: a client
      # never sees a partial release, and this is the draft-then-publish flow
      # immutable releases require. GoReleaser creates the release as a draft
      # (.goreleaser.yml: draft: true). Everything downstream of this job reads
      # the published assets, so this step is also the handoff.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${GITHUB_REF#refs/tags/v}" --draft=false

  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [release]
    environment: release
    permissions:
      contents: read # download the published release assets
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # This job produces no binaries of its own: it downloads what the release
      # actually published and verifies it against the cosign-signed
      # checksums.txt before packing anything. build-npm.mjs re-checks each
      # binary against the same manifest as it copies.
      - name: Fetch and verify release binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/fetch-release-assets.sh "${GITHUB_REF#refs/tags/v}" dist

      # npm >= 11.5.1 performs the OIDC exchange that trusted publishing needs;
      # setup-node's Node 22 ships an older npm, so it is upgraded below.
      # Provenance is attached automatically under trusted publishing (no
      # --provenance flag), and publish-npm.sh skips any version already on the
      # registry, so re-running this job is safe.
      #
      # The trusted publisher on npmjs.com must name this workflow file
      # (release.yml) and, because this job runs in the `release` environment,
      # that same environment. The job id is not part of the binding.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # A published npm version is permanent, so a broken tarball must fail the
      # release here, not after it is irreversibly on the registry.
      - name: Validate npm packages
        run: make validate-npm-local NPM_BINARIES=dist

      # --no-assemble publishes the tree the previous step validated instead of
      # building an equivalent one. Both builds verify every binary against the
      # same cosign-signed checksums.txt, so the old arrangement was not unsafe,
      # but it did mean the bytes on the registry were never the bytes the
      # validator opened. The script refuses a missing or wrong-version tree, so
      # the flag cannot turn a skipped build into a stale publish.
      - name: Publish to npm
        run: |
          set -euo pipefail
          npm install -g npm@11.5.1
          bash scripts/publish-npm.sh dist "${GITHUB_REF#refs/tags/v}" --no-assemble

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [release]
    environment: release
    permissions:
      contents: read # download the published release assets
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Fetch and verify release binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/fetch-release-assets.sh "${GITHUB_REF#refs/tags/v}" dist

      # One wheel per platform with the native binary in .data/scripts (the
      # uv/ruff model), validated before upload because a published PyPI file
      # name is burned forever even if the release is deleted.
      - name: Build and validate PyPI wheels
        run: make validate-pypi-local PYPI_BINARIES=dist

      # OIDC trusted publisher — no stored token, PEP 740 attestations
      # attached automatically, and skip-existing means a re-run of this job
      # lands on already-uploaded files without failing.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi/dist
          skip-existing: true

  homebrew:
    name: Homebrew tap
    runs-on: ubuntu-latest
    # verify-published, like mcp-registry and commit-manifests. The formula
    # itself does not need it — it pins release-asset hashes taken from the
    # cosign-verified checksums.txt in this job, which is a stronger check than
    # the one it now waits for, and verify_published_packages.py never looks at
    # a Homebrew artifact. What it buys is ordering: `brew install` is the
    # fastest path from a tag to a running binary on someone's machine, so
    # leaving this job on [release] alone made the tap the one channel that
    # advertised a version before anything had read the registries back. The
    # accepted cost is that a release whose npm or PyPI publish failed now
    # leaves the tap on the previous version, which is the correct outcome for
    # a release that is not fully out.
    needs: [release, verify-published]
    environment: release
    permissions:
      contents: read # download the published release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Fetch and verify checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/fetch-release-assets.sh --checksums-only "${GITHUB_REF#refs/tags/v}" dist

      # The tap deploy key writes to another repository, so it lives in a job
      # that runs no third-party code and holds nothing else.
      - name: Update Homebrew tap formula
        env:
          TAP_DEPLOY_KEY_B64: ${{ secrets.TAP_DEPLOY_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_DEPLOY_KEY_B64}" ]; then
            echo "::warning::TAP_DEPLOY_KEY_B64 secret is not configured — skipping Homebrew tap update"
            exit 0
          fi
          VERSION="${GITHUB_REF#refs/tags/v}"
          KEY_FILE="${RUNNER_TEMP}/tap_deploy_key"
          KNOWN_HOSTS_FILE="${RUNNER_TEMP}/tap_known_hosts"
          echo "${TAP_DEPLOY_KEY_B64}" | base64 --decode > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"
          ssh-keyscan -H github.com > "${KNOWN_HOSTS_FILE}"
          export GIT_SSH_COMMAND="ssh -i ${KEY_FILE} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${KNOWN_HOSTS_FILE}"
          bash scripts/update-homebrew-tap.sh dist/checksums.txt "${VERSION}" "${RUNNER_TEMP}/homebrew-tap"

  mcp-registry:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    # npm and pypi because the registry validates those package entries by
    # fetching the versions this release published: a pypi entry is checked by
    # GETting pypi.org/pypi/<name>/<version>/json, so racing the upload spends
    # the retry budget on a version that is not there yet. docker because it
    # validates the OCI entry by fetching the image tag and digest.
    # verify-published because this job is what points installers at the npm
    # and PyPI packages: the listing must not advertise bytes nobody compared
    # with the signed checksums.
    needs: [release, npm, pypi, docker, verify-published]
    environment: release
    permissions:
      contents: read # download the published release assets
      id-token: write # mcp-publisher login github-oidc
      attestations: read # verify the .mcpb provenance before hashing it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Fetch and verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/fetch-release-assets.sh "${GITHUB_REF#refs/tags/v}" dist "gitlab-mcp-server.mcpb"

      # Stamp the working tree only — the commit to main is a separate job with
      # a separate credential. The OCI digest comes from the docker job, so
      # server.json pins the exact image this release published rather than a
      # tag that could later be moved.
      - name: Stamp server.json with this release's hashes and digest
        env:
          OCI_DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${OCI_DIGEST}" ]; then
            echo "::error::the docker job published no image digest; server.json cannot be pinned"
            exit 1
          fi
          bash scripts/update-server-json-sha.sh dist/checksums.txt "${GITHUB_REF#refs/tags/v}" dist/gitlab-mcp-server.mcpb "${OCI_DIGEST}"

      - name: Publish to MCP Registry
        env:
          # Pin to a specific version of the mcp-publisher tool for supply-chain integrity.
          # Bump when a new mcp-publisher release is verified. Server version published comes from
          # the git tag (handled in the previous step by update-server-json-sha.sh).
          MCP_PUBLISHER_VERSION: "v1.8.1"
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        run: |
          set -euo pipefail
          TARBALL="mcp-publisher_linux_amd64.tar.gz"
          SIGSTORE_BUNDLE="${TARBALL}.sigstore.json"
          URL="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${TARBALL}"
          echo "Downloading ${URL}"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-connrefused -o "${TARBALL}" "${URL}"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-connrefused -o "${SIGSTORE_BUNDLE}" "${URL}.sigstore.json"
          echo "${MCP_PUBLISHER_SHA256}  ${TARBALL}" | sha256sum -c -
          cosign verify-blob \
            --bundle "${SIGSTORE_BUNDLE}" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${TARBALL}"
          tar xzf "${TARBALL}" mcp-publisher
          ./mcp-publisher login github-oidc
          set +e
          PUBLISH_STATUS=1
          for attempt in 1 2 3 4 5 6 7 8; do
            ./mcp-publisher publish 2>&1 | tee mcp-publisher-publish.log
            PUBLISH_STATUS=${PIPESTATUS[0]}
            [ "${PUBLISH_STATUS}" -eq 0 ] && break
            if grep -q "invalid version: cannot publish duplicate version" mcp-publisher-publish.log; then
              break
            fi
            # The registry validates the npm and pypi entries by fetching the
            # versions those jobs published minutes ago, and the oci entry by
            # fetching the image tag the docker job pushed. Retry only errors
            # the registry itself labels transient, plus a not-yet-visible npm
            # or PyPI version, which is indistinguishable from registry-side
            # propagation lag. Strings are quoted from the v1.8.1 validators
            # (internal/validators/registries/{npm,pypi,oci}.go); a genuine
            # "not found (status: 404)" is deliberately absent, so a truly
            # unpublished package fails fast.
            # The OCI validator's own 404 text — "does not exist in the
            # registry" — is absent for the same reason: the image is pushed by
            # the docker job this one depends on, so its absence is a broken
            # release rather than propagation lag, and retrying it would spend
            # ten minutes hiding that.
            if grep -qE "take a moment to appear|retry later|retry shortly|validation timed out" mcp-publisher-publish.log; then
              echo "::notice::Registry-side validation not yet consistent (attempt ${attempt}); retrying in 60s"
              sleep 60
              continue
            fi
            break
          done
          set -e
          if [ "${PUBLISH_STATUS}" -ne 0 ]; then
            if grep -q "invalid version: cannot publish duplicate version" mcp-publisher-publish.log; then
              echo "::notice::MCP Registry version ${GITHUB_REF#refs/tags/v} is already published; continuing"
            else
              exit "${PUBLISH_STATUS}"
            fi
          fi

  verify-published:
    name: Verify published packages
    runs-on: ubuntu-latest
    needs: [npm, pypi]
    permissions:
      contents: read # download the published release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Fetch and verify the signed checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/fetch-release-assets.sh --checksums-only "${GITHUB_REF#refs/tags/v}" dist

      # Downloads what npm and PyPI actually serve and compares the embedded
      # binaries with the signed checksums.txt. The publishers re-assemble
      # their packages after validating them, so this is the only step that
      # inspects the bytes a user installs, and it runs in a job holding no
      # publishing credential of any kind.
      #
      # The retry budget is the same allowance the mcp-registry publish step
      # gives itself, and for the same reason: this runs minutes after the
      # uploads, and a registry CDN that has not caught up answers 404. It is
      # spent only on downloads — a digest that does not match the signed
      # checksums fails on sight, with no second attempt.
      - name: Compare registry packages with the signed checksums
        run: |
          python3 scripts/verify_published_packages.py \
            --retry-budget 480 --retry-delay 30 \
            "${GITHUB_REF#refs/tags/v}" dist/checksums.txt

  commit-manifests:
    name: Commit manifests to main
    runs-on: ubuntu-latest
    # Last, deliberately. The commit lands the stamped server.json on main, and
    # a push to main runs check-server-json-packages, which fetches every
    # package the manifest declares. Committing before npm and PyPI have
    # published would fail that gate on a version that is merely not there yet.
    # Depending on the publishers also preserves the old single-job semantics:
    # a failed publish aborted before the commit ever happened. verify-published
    # is listed for the same reason and not left to transitivity through
    # mcp-registry: if what the registries serve does not match the signed
    # checksums, main must not gain a manifest advertising it.
    needs: [release, docker, npm, pypi, homebrew, mcp-registry, verify-published]
    environment: release
    permissions:
      contents: read # download the published release assets
      attestations: read # verify the .mcpb provenance before hashing it
    steps:
      # A fresh checkout of main in a job that runs no third-party code. The
      # deploy key pushes straight to a protected branch, so nothing that ran
      # earlier in some other job can have rewritten what it commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Fetch and verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/fetch-release-assets.sh "${GITHUB_REF#refs/tags/v}" dist "gitlab-mcp-server.mcpb"

      - name: Commit updated server.json and plugin.json to main
        env:
          RELEASE_DEPLOY_KEY_B64: ${{ secrets.RELEASE_DEPLOY_KEY_B64 }}
          OCI_DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ -z "${RELEASE_DEPLOY_KEY_B64}" ]; then
            echo "::error::RELEASE_DEPLOY_KEY_B64 secret is not configured"
            exit 1
          fi
          if [ -z "${OCI_DIGEST}" ]; then
            echo "::error::the docker job published no image digest; server.json cannot be pinned"
            exit 1
          fi

          KEY_FILE="${RUNNER_TEMP}/release_deploy_key"
          KNOWN_HOSTS_FILE="${RUNNER_TEMP}/known_hosts"
          echo "${RELEASE_DEPLOY_KEY_B64}" | base64 --decode > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"
          ssh-keyscan -H github.com > "${KNOWN_HOSTS_FILE}"

          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git config core.sshCommand "ssh -i ${KEY_FILE} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${KNOWN_HOSTS_FILE}"

          git config user.name "José M. Requena Plens"
          git config user.email "jmrplens@gmail.com"

          # The checkout is already main; refresh it in case another release
          # step landed something while this job waited.
          git fetch origin main
          git reset --hard origin/main

          # The script is idempotent and reads checksums.txt + version + the
          # bundle, all of which were verified against the release's cosign
          # signature above, so re-running it on the current main produces the
          # same result without inheriting anything from a dirty tree.
          bash scripts/update-server-json-sha.sh dist/checksums.txt "${VERSION}" dist/gitlab-mcp-server.mcpb "${OCI_DIGEST}"

          git add server.json
          [ -f plugin.json ] && git add plugin.json
          [ -f .plugin/plugin.json ] && git add .plugin/plugin.json
          [ -f mcpb/manifest.json ] && git add mcpb/manifest.json
          [ -f lhm.plugin.json ] && git add lhm.plugin.json
          [ -f npm/gitlab-mcp-server/package.json ] && git add npm/gitlab-mcp-server/package.json

          if git diff --cached --quiet; then
            echo "::notice::No manifest changes to commit"
            exit 0
          fi

          git commit -m "chore: update manifests for v${VERSION}

          Updates server.json (MCP Registry) with version ${VERSION} and
          pinned SHA256 hashes, and stamps version ${VERSION} into
          plugin.json (Agent Plugins), .plugin/plugin.json (legacy Open
          Plugins), mcpb/manifest.json (Claude Desktop extension), and
          lhm.plugin.json (LobeHub Marketplace)."
          git push origin main

  winget:
    name: Winget
    runs-on: windows-latest
    needs: [release]
    permissions: {} # both steps authenticate with WINGET_TOKEN, not GITHUB_TOKEN
    steps:
      # Publishes a version-update PR to microsoft/winget-pkgs via the
      # jmrplens/winget-pkgs fork. Only works once the initial package
      # manifest (jmrplens.gitlab-mcp-server) has been merged upstream —
      # continue-on-error keeps releases green until then and if Microsoft's
      # validation service hiccups.
      #
      # The fork MUST be synced first: komac creates its branch on the fork,
      # and a stale fork fails with "Ref cannot be created" — which the
      # releaser's continue-on-error then hides. That exact combination
      # silently skipped the 2.7.2 and 2.7.3 submissions (fork 24 days
      # behind). This step is deliberately blocking: if the sync fails
      # (409 divergence, 422), the releaser would fail against the stale
      # fork anyway and hide it — a red winget job is the visibility that
      # was missing, and nothing downstream depends on this job.
      - name: Sync winget-pkgs fork with upstream
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: gh api -X POST repos/jmrplens/winget-pkgs/merge-upstream -f branch=master
      # Pinned to a commit SHA (like every other action here): an
      # individually-maintained action that receives WINGET_TOKEN — a mutable
      # tag would let a compromised release exfiltrate it.
      - uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        continue-on-error: true
        with:
          identifier: jmrplens.gitlab-mcp-server
          installers-regex: '-windows-(amd64|arm64)\.exe$'
          release-tag: ${{ github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}
