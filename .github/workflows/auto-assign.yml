name: Auto-assign

# pull_request_target so that pull requests from forks are assigned too: the
# default GITHUB_TOKEN is read-only for fork pull requests under `pull_request`,
# and the assignment answered 403 on every outside contribution. The job reads
# only the event payload and calls the API; nothing of the pull request is
# checked out or run, so the elevated token is not exposed to it.
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

# The default is nothing; the job asks for what an assignment needs.
permissions: {}

jobs:
  assign:
    name: "🙋 Assign to the maintainer"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # assign an issue
      pull-requests: write # assign a pull request
    if: >-
      (github.event_name == 'issues' && github.event.issue.user.login != 'jmrplens' && github.event.issue.user.login != 'dependabot[bot]') ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.user.login != 'jmrplens' && github.event.pull_request.user.login != 'dependabot[bot]')
    steps:
      - name: Assign to jmrplens
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/issues/$NUMBER/assignees" \
            -f assignees[]=jmrplens