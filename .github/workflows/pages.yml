# Documentation site — Astro Starlight → GitHub Pages
#
# Triggers: push to main (site changes), manual dispatch

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "!site/node_modules/**"
  workflow_dispatch:

# Workflow-wide: a read token and nothing else. The build job runs third-party
# code (pnpm install, a headless Chromium fetched outside any lockfile), so the
# Pages credential and the OIDC identity that mints it live on `deploy`, which
# runs one pinned action and no code of its own.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so add-sitemap-lastmod.mjs can read per-file commit dates.
          fetch-depth: 0
          # The build runs third-party code (pnpm install); the sitemap script
          # only reads local git history, so the remote token is not needed.
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: site

      # rehype-mermaid renders every ```mermaid block to inline SVG at build
      # time using a headless Chromium, so the browser must be present before
      # `pnpm run build` — without it the build fails rather than degrading.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: site

      - run: pnpm run build
        working-directory: site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # publish the uploaded artifact
      id-token: write # actions/deploy-pages authenticates to Pages with OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  indexnow:
    name: Submit to IndexNow
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Notify IndexNow of updated URLs
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          if [ -z "${INDEXNOW_KEY:-}" ]; then
            echo "INDEXNOW_KEY not set — skipping IndexNow submission"
            exit 0
          fi
          # Use the actual deployed Pages URL (tracks a custom domain / CNAME and
          # any repo/org rename automatically).
          BASE="${PAGE_URL%/}"
          if [ -z "$BASE" ]; then echo "No deploy page_url available; aborting"; exit 1; fi
          HOST="$(printf '%s' "$BASE" | sed -E 's#^https?://([^/]+).*#\1#')"
          echo "Site base: $BASE (host: $HOST)"
          # Fetch the live sitemap with a short retry/backoff for deploy propagation.
          idx=""
          for attempt in 1 2 3 4 5; do
            if idx=$(curl -fsSL "$BASE/sitemap-index.xml"); then break; fi
            echo "sitemap fetch attempt ${attempt} failed; retrying in 10s…"
            sleep 10
          done
          if [ -z "$idx" ]; then echo "::warning title=IndexNow::could not fetch sitemap after retries (non-fatal); skipping submission"; exit 0; fi
          # Collect sub-sitemap URLs, then each sitemap's <loc> entries. A while
          # loop over a here-string (not a pipe) keeps errors from being masked
          # under `set -o pipefail`; a transient sub-sitemap fetch can't abort all.
          subs=$(printf '%s' "$idx" | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g')
          urls=""
          while IFS= read -r sm; do
            [ -n "$sm" ] || continue
            body=$(curl -fsSL "$sm" || true)
            urls="${urls}$(printf '%s' "$body" | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g')"$'\n'
          done <<< "$subs"
          url_json=$(printf '%s\n' "$urls" | grep . | jq -R . | jq -s .)
          count=$(printf '%s' "$url_json" | jq 'length')
          echo "Submitting $count URLs to IndexNow"
          payload=$(jq -n \
            --arg host "$HOST" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "https://${HOST}/${INDEXNOW_KEY}.txt" \
            --argjson urlList "$url_json" \
            '{host:$host, key:$key, keyLocation:$keyLocation, urlList:$urlList}')
          # `|| true` so a transport error (DNS/timeout) can't abort under set -e;
          # curl writes 000 to the http_code on failure, handled by the case below.
          code=$(curl -sS -o /tmp/indexnow.out -w '%{http_code}' \
            -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$payload" || true)
          echo "IndexNow responded HTTP $code"; cat /tmp/indexnow.out || true
          # IndexNow is a best-effort ping — never fail the deploy over it.
          # keyLocation points at the host ROOT (https://$HOST/<key>.txt) because
          # IndexNow verifies ownership at the host level, and a GitHub Pages
          # PROJECT site can't publish at the domain root. The key file is served
          # from the ${GITHUB_REPOSITORY_OWNER}.github.io user-site repository.
          case "$code" in
            200|202) echo "IndexNow: submitted OK" ;;
            *) echo "::warning title=IndexNow::submission returned HTTP $code (non-fatal); ensure the IndexNow key file is served at the domain root https://${HOST}/" ;;
          esac
