# Condition coverage on demand for gitlab-mcp-server (issue 1210)
#
# The condition gate is gobco, run through scripts/coverage-conditions.sh, the
# recipe behind `make coverage-conditions`. It is held on Linux before a
# commit, and the Windows and macOS legs of ci.yml hold only the files those
# systems alone build. Neither answers what a whole package scores on Windows
# or macOS, and until this workflow that figure could only be taken by hand on
# a machine of that system: the internal/toolutil figures quoted in #1206 came
# from a Windows virtual machine, and nobody could take them on macOS at all.
#
# This runs the same script, through bash as ci.yml runs it, on each runner a
# dispatch names, so every figure is the one the gate would compute there:
# measured on that system, never inferred from another.
#
# It also takes the figure for the whole tree: with tree set, every package
# below cmd/ and internal/ is measured, in shards, and the summary adds up
# each system's total. mode chooses what gobco counts: condition, its
# default, counts every operand of && and || and every comparison; branch is
# gobco's -branch, which counts the whole condition of each if and for and
# each switch case, the branches the OpenSSF Best Practices criterion
# test_branch_coverage80 asks about. docs/development/testing/README.md
# records the figures taken in both, and the command that takes them on any
# machine.
#
# Dispatch only. A push or a pull request never runs it: the answer is wanted
# when somebody asks the question, and a package can take the better part of
# an hour on Windows. Nothing here is a gate. No figure fails it, whatever the
# gate mode holds; a run that cannot measure at all (a package go cannot load,
# a failing test, a 0/0 report, a runtime crash of issue 467) still fails its
# job, and says why.
#
# Shape: plan validates the inputs and, for an empty package list, finds the
# packages carrying a GOOS- or GOARCH-constrained file, or with tree lists
# the tree and deals it into shards; measure fans out over job x system, each
# job measuring its packages one after another; summary joins the records the
# runs uploaded into one table, with the totals, in the job summary. The plan,
# the measuring loop and the table are cmd/measure_conditions, whose tests
# hold this file to the record it reads.
#
# Dispatch with:
#
#   gh workflow run conditions.yml -f packages="./cmd/server ./internal/toolutil" \
#     -f systems="windows-latest macos-latest ubuntu-latest" -f gate=all
#
#   gh workflow run conditions.yml -f tree=true -f systems=ubuntu-latest -f gate=all
#
#   gh workflow run conditions.yml -f tree=true -f systems=ubuntu-latest -f gate=all -f mode=branch

name: Condition Coverage

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to measure, ./cmd/server style, separated by spaces or commas. Empty measures every package carrying a GOOS- or GOARCH-constrained file."
        default: ""
        type: string
      gate:
        description: "The GOBCO_GATE the script runs with. all holds every condition; beyond:linux/amd64 holds only the files linux/amd64 does not build, as ci.yml's legs do. The figures are the same under either."
        default: all
        type: choice
        options:
          - all
          - beyond:linux/amd64
      systems:
        description: "Runners to measure on, separated by spaces or commas: windows-latest, macos-latest, ubuntu-latest (the comparison)."
        default: "windows-latest macos-latest ubuntu-latest"
        type: string
      tree:
        description: "Measure every package below cmd/ and internal/ instead, in shards, with each system's total. Leave packages empty."
        default: false
        type: boolean
      mode:
        description: "What gobco counts. condition, its default, counts every operand of && and || and every comparison; branch (gobco -branch) counts the whole condition of each if and for and each switch case."
        default: condition
        type: choice
        options:
          - condition
          - branch

# Read only. Nothing here writes to the repository, comments, or mints an
# identity: the default token reads the checkout and the artifacts of this run.
permissions:
  contents: read

# No concurrency group. Two dispatches ask two questions, and GitHub keeps at
# most one pending run per group, cancelling the older one when another
# arrives: with a measurement running, a third dispatch would cancel the
# second one waiting behind it, and nothing would say so.

jobs:
  plan:
    name: "📋 Plan"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # The inputs reach the command through the environment, never through
      # the expression syntax inside the script, so a value is data whatever
      # it holds. The command refuses a package, a runner or a gate it would
      # not hand on, and for an empty package list lists the module under
      # every release target to find the packages whose files differ. With
      # tree it lists the packages below cmd/ and internal/ instead, and
      # refuses a package list beside it. The mode is refused here too when
      # the script would refuse it, before any runner starts.
      - name: Plan the runs
        id: plan
        shell: bash
        env:
          PACKAGES: ${{ inputs.packages }}
          SYSTEMS: ${{ inputs.systems }}
          GATE: ${{ inputs.gate }}
          MODE: ${{ inputs.mode }}
          TREE: ${{ inputs.tree }}
        run: go run ./cmd/measure_conditions plan -packages "$PACKAGES" -systems "$SYSTEMS" -gate "$GATE" -mode "$MODE" -tree="$TREE" >> "$GITHUB_OUTPUT"

  measure:
    name: "🔬 ${{ matrix.name }} on ${{ matrix.system }}"
    needs: plan
    runs-on: ${{ matrix.system }}
    # gobco's go test is bounded at 30 minutes below, the bound ci.yml gives
    # cmd/server on Windows. A job of named packages measures one, and keeps
    # the hour it had before the tree could be measured; a shard of the tree
    # measures fifteen or so one after another, and is given two. Each bound
    # leaves room for the toolchain and the staged copies around the
    # measuring, and ends a hang on a runner billed at a multiple of the Linux
    # rate.
    timeout-minutes: ${{ inputs.tree && 120 || 60 }}
    strategy:
      # Every run reports. Stopping at the first that could not measure would
      # hide every figure the others took.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go mod download
      # gobco once for every package of the job, through the script, as
      # ci.yml's legs install it: the script then runs it from PATH rather
      # than through `go run`, which asks the module proxy on every run, and a
      # shard of the tree runs it fifteen times or so, each of which a runner
      # that lost name resolution would fail (issue 1515).
      - name: Install gobco
        shell: bash
        timeout-minutes: 5
        run: bash scripts/coverage-conditions.sh --install
      # The script, through bash, exactly as ci.yml's legs run it and as
      # `make coverage-conditions` runs it, with the gate and the mode the
      # dispatch chose, over each package of the job one after another. The
      # measure subcommand runs it and writes each package's record: both
      # streams of the script go to the log and to the package's raw output
      # file, beside a run.env naming the package, the runner, the platform
      # and the script's status, in a directory of its own named after the
      # package.
      #
      # The records are written outside the checkout: the script copies the
      # module into a staged directory for a package with a platform file,
      # and a file written inside the tree would be copied with it.
      # RUNNER_TEMP is a Windows path on Windows, written with slashes here,
      # which Git Bash and go both read, as the script does with go list's
      # directories.
      #
      # The script's status is read for one thing: 0 and 3 are a measurement
      # (3 is the gate holding a condition, which the script uses for nothing
      # else), and anything else means nothing was measured. A package not
      # measured fails the job with the reason once the job's other packages
      # are measured; a figure never does.
      #
      # setup-go registers a problem matcher, owner go, that files every line
      # shaped like file.go:line:col: text as an error annotation, and every
      # condition gobco names, with the copy the gate prints under its
      # verdict, is shaped that way: a run that measured would show a column
      # of errors, and past GitHub's ten per step the one this step writes
      # when nothing was measured would be dropped. The matcher is removed
      # before anything is printed, so the only annotation here is that one.
      - name: Measure
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
          SYSTEM: ${{ matrix.system }}
          ARTIFACT: ${{ matrix.artifact }}
          GOBCO_GATE: ${{ inputs.gate }}
          GOBCO_MODE: ${{ inputs.mode }}
          GOBCO_TEST_FLAGS: -timeout=30m
        run: |
          echo "::remove-matcher owner=go::"
          status=0
          go run ./cmd/measure_conditions measure -packages "$PACKAGES" -system "$SYSTEM" -records "${RUNNER_TEMP//\\//}/$ARTIFACT" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error title=Not measured::a package of this job was not measured on $SYSTEM (measure_conditions exited $status); the measure_conditions: and gobco: lines above say which and why, and the raw output is in the artifact $ARTIFACT"
            exit "$status"
          fi
          echo "Measured. The figures are in the summary job's table."
      # Uploaded whatever became of the measurement, since a run that could
      # not measure is the one whose output somebody will want to read. A run
      # that never reached the step above has nothing to upload, which the
      # summary reports as no record. A rerun of a failed job replaces its
      # earlier upload.
      - name: Upload the record and the raw gobco output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/${{ matrix.artifact }}
          retention-days: 30
          if-no-files-found: ignore
          overwrite: true

  summary:
    name: "📊 Summary"
    needs: [plan, measure]
    # Written whatever became of the runs, measured or not; only a plan that
    # never came leaves nothing to join.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # Every run's artifact, wherever the download puts it: one directory
      # per artifact, or the directory itself when there is only one, which
      # the command reads either way. A run that uploaded nothing is missing
      # here and named as such in the table.
      - name: Download the records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: gobco-*
          path: ${{ runner.temp }}/records
      # The table goes to the job summary and to the log, headed by the mode
      # the runs measured in, whose figure it reads each record's in. The
      # command exits non-zero only when a record cannot be read or disagrees
      # with itself, never on a figure.
      - name: Write the job summary
        shell: bash
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          GATE: ${{ inputs.gate }}
          MODE: ${{ inputs.mode }}
          COMMIT: ${{ github.sha }}
        run: go run ./cmd/measure_conditions summarize -plan "$MATRIX" -records "$RUNNER_TEMP/records" -gate "$GATE" -mode "$MODE" -commit "$COMMIT" | tee -a "$GITHUB_STEP_SUMMARY"
