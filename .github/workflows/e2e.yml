# E2E test workflow for gitlab-mcp-server
#
# Runs the e2e suite against an ephemeral Docker-based GitLab CE instance.
# Duration: ~15-20 min (GitLab boot ~5 min + tests ~5-10 min).
#
# Three ways in. Manually, from the "Use workflow from" dropdown, optionally
# with a custom ref such as a fork pull request's merge SHA. As a reusable
# workflow, which is how the release pipeline runs its E2E gate: the job used
# to be copied into release.yml line for line, so a fix to the harness landed
# in one place and not the other. And once a week on main, against the
# current gitlab-ce:latest, because nothing else runs this suite between
# releases: the first release rehearsal found three tests that had been
# broken on main for weeks, one of them green on a copy of the server it was
# meant to test (issue 474). The weekly run is not a required check; it is
# the one place the suite meets a real GitLab while nobody is tagging.

name: E2E Tests

on:
  schedule:
    # Mondays, 05:17 UTC: off the hour, since GitHub delays runs that pile up
    # on round times, and before the week's first pushes.
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to checkout (branch, tag, or PR merge SHA from a fork)"
        default: ""
        type: string
      gitlab_image:
        description: "GitLab CE Docker image"
        default: "gitlab/gitlab-ce:latest"
        type: string
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout; empty means the calling workflow's ref"
        default: ""
        type: string
      gitlab_image:
        description: "GitLab CE Docker image"
        default: "gitlab/gitlab-ce:latest"
        type: string

permissions:
  contents: read

env:
  GITLAB_IMAGE: ${{ inputs.gitlab_image || 'gitlab/gitlab-ce:latest' }}

jobs:
  e2e:
    name: "🧫 E2E (Docker GitLab)"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # No version: gotestsum is a `tool` directive in go.mod, so this installs
      # the version go.mod names and Dependabot bumps it with the other modules.
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum

      - name: Pull GitLab image
        run: docker pull "${GITLAB_IMAGE}"

      - name: Start GitLab via Docker Compose
        working-directory: test/e2e
        run: |
          GITLAB_IMAGE="${GITLAB_IMAGE}" docker compose up -d
          echo "GitLab container started — waiting for readiness..."

      - name: Wait for GitLab readiness
        working-directory: test/e2e
        run: bash scripts/wait-for-gitlab.sh
        timeout-minutes: 10

      - name: Setup GitLab user and token
        working-directory: test/e2e
        run: bash scripts/setup-gitlab.sh

      - name: Register GitLab Runner
        working-directory: test/e2e
        run: bash scripts/register-runner.sh

      - name: Load environment
        working-directory: test/e2e
        run: |
          # setup-gitlab.sh writes .env.docker with GITLAB_URL, GITLAB_TOKEN, etc.
          cat .env.docker >> "$GITHUB_ENV"

      - name: Run E2E tests
        run: |
          gotestsum \
            --junitfile test-results/e2e-junit.xml \
            --format standard-verbose \
            -- -v -tags e2e -timeout 1800s -count=1 ./test/e2e/suite/
        env:
          E2E_MODE: "docker"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 14

      - name: Tear down GitLab
        if: always()
        working-directory: test/e2e
        run: docker compose down -v --remove-orphans
