# E2E test workflow for gitlab-mcp-server
#
# Runs the e2e suite against an ephemeral Docker-based GitLab CE instance.
# Duration: ~15-20 min (GitLab boot ~5 min + tests ~5-10 min).
#
# Two jobs, each with a GitLab of its own. `e2e` runs the suite under
# test/e2e/suite, which gates releases. `e2e-gitlab` runs the rebuilt suite
# under test/e2e/gitlab, which drives the real binary over stdio and records
# what the server dispatched; it is non-blocking (continue-on-error) while
# the old suite's tests are ported, and its coverage report is uploaded
# beside the results. It becomes the gate, and the old job goes, when the
# port is complete.
#
# Three ways in. Manually, from the "Use workflow from" dropdown, optionally
# with a custom ref such as a fork pull request's merge SHA. As a reusable
# workflow, which is how the release pipeline runs its E2E gate: the job used
# to be copied into release.yml line for line, so a fix to the harness landed
# in one place and not the other. And once a week on main, against the
# current gitlab-ce:latest, because nothing else runs this suite between
# releases: the first release rehearsal found three tests that had been
# broken on main for weeks, one of them green on a copy of the server it was
# meant to test (issue 474). The weekly run is not a required check; it is
# the one place the suite meets a real GitLab while nobody is tagging.

name: E2E Tests

on:
  schedule:
    # Mondays, 05:17 UTC: off the hour, since GitHub delays runs that pile up
    # on round times, and before the week's first pushes.
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to checkout (branch, tag, or PR merge SHA from a fork)"
        default: ""
        type: string
      gitlab_image:
        description: "GitLab CE Docker image"
        default: "gitlab/gitlab-ce:latest"
        type: string
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout; empty means the calling workflow's ref"
        default: ""
        type: string
      gitlab_image:
        description: "GitLab CE Docker image"
        default: "gitlab/gitlab-ce:latest"
        type: string

permissions:
  contents: read

env:
  GITLAB_IMAGE: ${{ inputs.gitlab_image || 'gitlab/gitlab-ce:latest' }}

jobs:
  e2e:
    name: "🧫 E2E (Docker GitLab)"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # No version: gotestsum is a `tool` directive in go.mod, so this installs
      # the version go.mod names and Dependabot bumps it with the other modules.
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum

      - name: Pull GitLab image
        run: docker pull "${GITLAB_IMAGE}"

      - name: Start GitLab via Docker Compose
        working-directory: test/e2e
        run: |
          GITLAB_IMAGE="${GITLAB_IMAGE}" docker compose up -d
          echo "GitLab container started — waiting for readiness..."

      - name: Wait for GitLab readiness
        working-directory: test/e2e
        run: bash scripts/wait-for-gitlab.sh
        timeout-minutes: 10

      - name: Setup GitLab user and token
        working-directory: test/e2e
        run: bash scripts/setup-gitlab.sh

      - name: Register GitLab Runner
        working-directory: test/e2e
        run: bash scripts/register-runner.sh

      - name: Load environment
        working-directory: test/e2e
        run: |
          # setup-gitlab.sh writes .env.docker with GITLAB_URL, GITLAB_TOKEN, etc.
          cat .env.docker >> "$GITHUB_ENV"

      # The suite records every call it makes and every route the server
      # dispatched into the calls directory, one shard per test process, and
      # the JSON stream beside it carries each test's verdict; together they
      # are what cmd/audit_e2e_coverage reads. Both land under test-results,
      # which the next step uploads. The directory must be absolute: the test
      # binary runs in its own package directory and the recorder refuses a
      # relative path rather than scatter shards under it.
      - name: Run E2E tests
        run: |
          # The checkout is the dispatched ref, which github.sha is not when
          # a ref was given, so the recorded revision is read off the tree.
          E2E_COMMIT="$(git rev-parse HEAD)"
          export E2E_COMMIT
          gotestsum \
            --junitfile test-results/e2e-junit.xml \
            --jsonfile test-results/e2e-log.json \
            --format standard-verbose \
            -- -v -tags e2e -timeout 1800s -count=1 ./test/e2e/suite/
        env:
          E2E_MODE: "docker"
          GITLAB_MCP_TEST_E2E_CALLS_DIR: ${{ github.workspace }}/test-results/e2e-calls

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 14

      - name: Tear down GitLab
        if: always()
        working-directory: test/e2e
        run: docker compose down -v --remove-orphans

  # The rebuilt suite, on a GitLab CE of its own: the common and ce packages,
  # driven through the real binary by test/e2e/scripts/run-docker-e2e.sh, the
  # same lifecycle `make test-e2e-ce` runs. The licensed ee package stays
  # local, since the license is renewed by hand. Non-blocking until the port
  # is complete: a failure here is visible on the run and stops nothing.
  e2e-gitlab:
    name: "🧫 E2E (rebuilt suite, Docker GitLab)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum

      # Built once and handed to every package through E2E_SERVER_BINARY, so
      # the three test binaries do not each build cmd/server.
      - name: Build the server the suite drives
        run: go build -o dist/e2e/gitlab-mcp-server ./cmd/server

      # The script brings the stack up, provisions it, runs the packages with
      # -p 1 -count=1 and tears the stack down, keeping the run's status. The
      # Bitbucket fixture is left out here as the old job leaves it out: the
      # importer scenarios are ported later and the runner's memory is finite.
      # The calls directory is absolute because the recorder refuses a
      # relative one, and the reports go under test-results for the upload.
      - name: Run the rebuilt E2E suite
        run: |
          E2E_COMMIT="$(git rev-parse HEAD)"
          export E2E_COMMIT
          ./test/e2e/scripts/run-docker-e2e.sh ce -- -timeout 1800s ./test/e2e/gitlab/common/ ./test/e2e/gitlab/ce/
        env:
          E2E_BITBUCKET: "false"
          E2E_SERVER_BINARY: ${{ github.workspace }}/dist/e2e/gitlab-mcp-server
          E2E_REPORT_DIR: ${{ github.workspace }}/test-results
          E2E_REPORT_NAME: e2e-gitlab
          GITLAB_MCP_TEST_E2E_CALLS_DIR: ${{ github.workspace }}/test-results/e2e-calls

      # What the run covered, from the calls it recorded and the verdicts
      # gotestsum wrote: the JSON report is uploaded with the results and the
      # Markdown summary lands on the run. -check applies the floors: the ce
      # runtime present, test calls recorded, no package refused.
      - name: Audit E2E coverage
        if: always()
        run: |
          go run ./cmd/audit_e2e_coverage/ \
            -calls test-results/e2e-calls \
            -results test-results/e2e-gitlab-log.json \
            -runtime ce \
            -check \
            -o test-results/e2e-coverage.json \
            -summary "$GITHUB_STEP_SUMMARY"

      # The children's stderr goes with the results: when a test failed
      # because the server refused something, the reason is in the server's
      # log and nowhere else.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-gitlab-test-results
          path: |
            test-results/
            dist/e2e-reports/servers/
          retention-days: 14
