# The advisories make check-dependency-vulns may set aside in the lockfile of
# this directory, go.mod, each because it is not exploitable here.
# The policy is SECURITY.md, Dependencies, and make check-supply-chain holds
# every entry to it: one [[IgnoredVulns]] table per advisory, written as id,
# ignoreUntil and reason and nothing else, the reason opening with the OpenVEX
# justification that makes the advisory not exploitable here, and ignoreUntil,
# the review date, at most six months ahead. OSV-Scanner stops honoring an
# entry on that date, and the scan fails on an entry that sets nothing aside.
# A malicious-package advisory (MAL-) is never set aside, and the target's
# second scan, which honors no allow list, fails on one whatever id an entry
# here names. OpenSSF Scorecard's Vulnerabilities check reads this file too.
# An advisory set aside here is also stated, with the same justification, in
# vex/gitlab-mcp-server.openvex.json, the OpenVEX document every release
# attaches, which make check-vex holds to the source scan.
#
# None is set aside today. GO-2026-5932, against golang.org/x/crypto, was
# until golang.org/x/crypto v0.59.0, the first release past the commit that
# removed openpgp and that the Go vulnerability database names as the fix.
