# The advisories make check-dependency-vulns may set aside in this directory's
# lockfile, pnpm-lock.yaml, each because it is not exploitable here. The
# policy and the shape of an entry are SECURITY.md, Dependencies, and the
# header of the osv-scanner.toml at the repository root; make
# check-supply-chain holds every entry to them. A fixed version the site can
# take goes in pnpm-workspace.yaml as an override instead, and an entry here
# turns into a failure the day the lockfile moves past the advisory, which is
# what removes it.

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-01-31
reason = "vulnerable_code_cannot_be_controlled_by_adversary: the amplification needs an attacker to supply the glob pattern, and minimatch 10.2.6 and 3.1.5 reach the site only through development tooling that matches patterns written in this repository against its own files: 10.2.6 through eslint, @eslint/config-array and @typescript-eslint/typescript-estree, and 3.1.5 through glob 7 under pa11y-ci's globby 7. Nothing the site serves runs it. The fix is minimatch 11.0.1, which htmlhint's glob already matches with since pnpm-workspace.yaml moves it to 14; it is a major none of those consumers accepts, and forcing it onto glob 7, which calls the 3.x module as a function, would also change the API it imports."
