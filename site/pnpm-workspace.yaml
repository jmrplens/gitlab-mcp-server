packages:
  - .

overrides:
  # lodash-es is lodash's code under another name and carries lodash's two
  # advisories: code injection through _.template (GHSA-r5fr-rjxr-66jc, high)
  # and prototype pollution through _.unset (GHSA-f23m-r3pf-42rh), both
  # patched in 4.18.0. It arrived with mermaid 12, which reaches it through
  # chevrotain, and mermaid 11 pulled neither: the audit went from zero
  # advisories to two on that bump alone. Pinned rather than the bump reverted,
  # because the fix is a version that exists and the alternative is holding a
  # rendering dependency back for a transitive parser's dependency. chevrotain
  # 13.2.0, which mermaid 12.1.0 moved to, no longer depends on lodash-es, but
  # dagre-d3-es 7.0.14, which mermaid pins exactly, asks for ^4.17.21, a range
  # that still admits the vulnerable releases, so the pin is still what keeps
  # it off them. lodash itself needs no pin any more: its one consumer,
  # pa11y-ci, asks for ~4.18.1.
  lodash-es: 4.18.1
  # brace-expansion ReDoS (GHSA-3jxr-9vmj-r5cp) and unbounded-expansion DoS
  # (GHSA-mh99-v99m-4gvg, GHSA-rgw5-rvv9-x895); dev/build deps only.
  # Both branches can be pinned to a patched version and neither needs an audit
  # exception. Do not force 5.x onto a 1.x consumer: v1 exported the expand
  # function directly where v5 exports an object. 1.1.18 and 5.0.9 then became
  # vulnerable themselves: stack exhaustion through uncontrolled recursion in
  # parseCommaParts (GHSA-6j4f-fj2g-mc7p, fixed in 1.1.19 and 5.0.10) and on
  # nested brace groups (GHSA-qhr7-859c-m2p7, fixed in 1.1.20 and 5.0.11), and
  # quadratic-time expansion of the `{a},b}` rewrite (GHSA-q2hr-2g5m-vwhr,
  # fixed in 1.1.21 and 5.0.12), so both pins move to 1.1.21 on the 1.x tag
  # and 5.0.12, the last release of each line.
  "brace-expansion@<1.1.21": 1.1.21
  "brace-expansion@>=3.0.0 <5.0.12": 5.0.12
  # fast-uri host confusion via failed IDN / backslash authority
  # (GHSA-4c8g-83qw-93j6, GHSA-v2hh-gcrm-f6hx, GHSA-6q2v-7v5f-6qmw), and via
  # percent-encoded scheme normalization (GHSA-jqff-g426-hqxp, which the 3.1.5
  # this line used to pin does not carry a fix for). Dev/build deps only, now
  # reached through @astrojs/check's language server as well as html-validate.
  # Pinned exactly rather than ">=": an open range now resolves to 4.x, and a
  # major bump of ajv's URI parser is not what an advisory fix should drag in.
  # 3.1.6 then became the vulnerable version itself: authority injection
  # through an unvalidated port in serialize (GHSA-qw65-cvwx-89v3, fixed in
  # 3.1.7) and host confusion through an unclosed bracket in the authority
  # (GHSA-58mr-gqgx-xq4g, affecting 3.1.6 alone), so the pin moved to 3.1.8.
  # 3.1.8 then became vulnerable itself: scheme spoofing through a
  # percent-encoded scheme (GHSA-w74x-v6f9-j3xg), host confusion during
  # canonicalization (GHSA-wjr9-j795-jxcr), relative-reference normalization
  # (GHSA-xhq7-xmqj-769h) and scheme injection in suffix references
  # (GHSA-333x-w4r6-6crp), all fixed in 3.1.9, so the pin moves to 3.1.9, the
  # last 3.1.x release.
  "fast-uri@<3.1.9": 3.1.9
  # undici reaches two majors here: 8.x through the build (astro > unifont)
  # and 7.x through the dev tooling (pa11y-ci > cheerio, which moved from 6.x
  # at cheerio 1.2.0). GHSA-3wwx-pv8p-q78v was fixed in 8.10.2, the version
  # this line used to pin, and 8.10.2 then became vulnerable itself: eight
  # advisories fixed in 8.12.2 and 7.30.1 on 2026-10-15, four of them high
  # (GHSA-qrxm-fqhp-jwvm, GHSA-2m5v-pch6-74hx, GHSA-4w7w-5xrc-9h26,
  # GHSA-xjj6-f33q-929c) and four moderate (GHSA-55wc-3pg8-jfw6,
  # GHSA-f72v-6w45-q472, GHSA-4qv8-2p9j-2685, GHSA-9fm3-97px-rjf6). Each line
  # is pinned to its newest release, 8.12.3 and 7.30.1, since forcing one
  # major onto the other's consumers is not what an advisory fix should do.
  "undici@>=7.0.0 <7.30.1": 7.30.1
  "undici@>=8.0.0 <8.12.3": 8.12.3
  # js-yaml quadratic CPU consumption in !!omap resolution (GHSA-5p4m-2wfm-xmqj,
  # CVE-2026-59870), and then maxTotalMergeKeys not bounding CPU for empty
  # merge sources (GHSA-2883-xcg3-v3hh), which the 4.3.1 this line used to pin
  # is itself vulnerable to. Build deps only (@astrojs/internal-helpers and
  # friends). 4.3.2 is the v4-legacy tag: the 4.x line is what Astro depends
  # on, and pinning 5.x onto it is a major bump an advisory fix should not drag
  # in.
  "js-yaml@>=4.0.0 <4.3.2": 4.3.2
  # KaTeX prototype pollution that bypasses its trust restrictions
  # (GHSA-238p-pmpm-9mq7), fixed in 0.18.2 and in no 0.16 release.
  # rehype-mermaid reaches 0.16 through mermaid-isomorphic, which asks for
  # ^0.16.0 itself and again through mermaid 11, so both move to the 0.18 line
  # mermaid 12 already uses: mermaid-isomorphic only adds KaTeX's stylesheet to
  # the page it renders diagrams in, and mermaid 11 runs there from its own
  # bundle. Reached at build time only. Pinned to 0.18.10, the newest release
  # of that line npm does not mark deprecated: 0.18.11 was published with
  # breaking changes and deprecated for them.
  "katex@<0.18.2": 0.18.10
  # glob's AbortSignal cancellation bypass (GHSA-3g3m-2fjr-6pw4), fixed in
  # 14.0.2 and in no 13.x release. htmlhint asks for ^13.0.6 and calls only
  # globSync and globStream, which 14 keeps; dev deps only. glob 14 also moves
  # its matching to minimatch 11, the only line with the fix for the globParts
  # amplification (GHSA-g3hv-75wg-m249), which only glob reached here, through
  # the optimizationLevel 2 it sets. The advisory lists every earlier minimatch
  # as well, so site/osv-scanner.toml sets it aside for two that are not
  # pinned: the 10.2.6 eslint, @eslint/config-array and
  # @typescript-eslint/typescript-estree match with at the default level 1,
  # which never runs that code, and the 3.1.5 pa11y-ci reaches through globby 7
  # and glob 7, which has no such code.
  # glob 7 calls the module as a function, the trap brace-expansion's entry
  # describes, and forcing 11 onto eslint's three would drag a major in for
  # code they do not run.
  "glob@>=9.0.0 <14.0.2": 14.0.3

auditConfig:
  ignoreGhsas:
    # http-cache-semantics honours a client's max-stale on a shared-cache entry
    # that was zeroed for security, so one user can be served another's cached
    # response, Set-Cookie included (GHSA-ch52-4w7c-c8xp). The advisory lists
    # every release up to 4.2.0 and names no fixed one. The lockfile resolves
    # 4.3.0 (2026-10-04), which astro 7.4 asks for and the advisory does not
    # list, but 4.3.0 changes Vary matching and adds status() and leaves the
    # max-stale branch of evaluateRequest() as it was, so the exception stays
    # for the day the advisory's range catches up with the code. Build-time
    # only: astro is its one consumer and imports it only in
    # assets/build/remote.js, to
    # decide how long a remote image fetched during a build stays fresh. It
    # calls only storable() and timeToLive() on a request it builds itself,
    # and max-stale is read only in evaluateRequest(), which astro never
    # calls; the site is static and serves no response through it. Remove
    # this exception once http-cache-semantics publishes a fixed release or
    # astro stops using it.
    - GHSA-ch52-4w7c-c8xp

peerDependencyRules:
  allowedVersions:
    typescript: ">=6.0.0"

# TypeScript stays on 6.x, and the caret in package.json is not the reason: a
# dependency sweep that reaches for the latest will take 7 and the site will
# still build, because what breaks is the gate rather than the build.
# `astro check`, which `pnpm run lint` runs first and CI runs as Site lint,
# refuses outright: "The TypeScript module loaded (found 7.0.2) does not expose
# the programmatic API that astro check relies on. TypeScript's native compiler
# (7.0 and later) does not ship this API yet." Tracked upstream at
# https://github.com/withastro/roadmap/discussions/1321; raise the floor when
# that lands, and not before.

allowBuilds:
  puppeteer: true
  sharp: true

# Disable the supply-chain release-age gate so dependencies always resolve to
# the latest published versions (pnpm 11.8 applies a non-zero default otherwise).
minimumReleaseAge: 0
