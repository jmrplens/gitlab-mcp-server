packages:
  - .

overrides:
  esbuild: 0.28.1
  lodash: 4.18.1
  # lodash-es is the same code under another name and carries the same two
  # advisories: code injection through _.template (GHSA-r5fr-rjxr-66jc, high)
  # and prototype pollution through _.unset (GHSA-f23m-r3pf-42rh), both
  # patched in 4.18.0. It arrived with mermaid 12, which reaches it through
  # chevrotain, and mermaid 11 pulled neither: the audit went from zero
  # advisories to two on that bump alone. Pinned rather than the bump reverted,
  # because the fix is a version that exists and the alternative is holding a
  # rendering dependency back for a transitive parser's dependency.
  lodash-es: 4.18.1
  yaml: 2.9.0
  yaml-language-server@1.20.0>yaml: 2.9.0
  # brace-expansion ReDoS (GHSA-3jxr-9vmj-r5cp) and unbounded-expansion DoS
  # (GHSA-mh99-v99m-4gvg, GHSA-rgw5-rvv9-x895); dev/build deps only.
  # Both branches can be pinned to a patched version and neither needs an audit
  # exception. Do not force 5.x onto a 1.x consumer: v1 exported the expand
  # function directly where v5 exports an object. 1.1.18 and 5.0.9 then became
  # vulnerable themselves: stack exhaustion through uncontrolled recursion in
  # parseCommaParts (GHSA-6j4f-fj2g-mc7p, fixed in 1.1.19 and 5.0.10) and on
  # nested brace groups (GHSA-qhr7-859c-m2p7, fixed in 1.1.20 and 5.0.11), and
  # quadratic-time expansion of the `{a},b}` rewrite (GHSA-q2hr-2g5m-vwhr,
  # fixed in 1.1.21 and 5.0.12), so both pins move to 1.1.21 on the 1.x tag
  # and 5.0.12, the last release of each line.
  "brace-expansion@<1.1.21": 1.1.21
  "brace-expansion@>=3.0.0 <5.0.12": 5.0.12
  # fast-uri host confusion via failed IDN / backslash authority
  # (GHSA-4c8g-83qw-93j6, GHSA-v2hh-gcrm-f6hx, GHSA-6q2v-7v5f-6qmw), and via
  # percent-encoded scheme normalization (GHSA-jqff-g426-hqxp, which the 3.1.5
  # this line used to pin does not carry a fix for). Dev/build deps only, now
  # reached through @astrojs/check's language server as well as html-validate.
  # Pinned exactly rather than ">=": an open range now resolves to 4.x, and a
  # major bump of ajv's URI parser is not what an advisory fix should drag in.
  # 3.1.6 then became the vulnerable version itself: authority injection
  # through an unvalidated port in serialize (GHSA-qw65-cvwx-89v3, fixed in
  # 3.1.7) and host confusion through an unclosed bracket in the authority
  # (GHSA-58mr-gqgx-xq4g, affecting 3.1.6 alone), so the pin moves to 3.1.8,
  # the last 3.1.x release.
  "fast-uri@<3.1.8": 3.1.8
  # ip-address Address4 decodes leading-zero octets as decimal (GHSA-8gjw-6f7c-jmc4),
  # and then two advisories on every release up to 10.5.0 (GHSA-2vr4-cq9g-pvrc,
  # GHSA-rpw4-54j3-4h4q), both fixed in 10.5.1; dev/build deps only
  # (pa11y-ci > puppeteer > socks-proxy-agent > socks).
  "ip-address@<10.5.1": 10.5.1
  # undici GHSA-3wwx-pv8p-q78v, which reaches two majors here: 8.x through
  # the build (astro > unifont) and 6.x through the dev tooling
  # (pa11y-ci > cheerio), fixed in 8.10.2 and 6.28.1.
  # Each line is pinned to its own patched release, since forcing one major
  # onto the other's consumers is not what an advisory fix should do.
  "undici@>=6.25.0 <6.28.1": 6.28.1
  "undici@>=8.1.0 <8.10.2": 8.10.2
  # js-yaml quadratic CPU consumption in !!omap resolution (GHSA-5p4m-2wfm-xmqj,
  # CVE-2026-59870), and then maxTotalMergeKeys not bounding CPU for empty
  # merge sources (GHSA-2883-xcg3-v3hh), which the 4.3.1 this line used to pin
  # is itself vulnerable to. Build deps only (@astrojs/internal-helpers and
  # friends). 4.3.2 is the v4-legacy tag: the 4.x line is what Astro depends
  # on, and pinning 5.x onto it is a major bump an advisory fix should not drag
  # in.
  "js-yaml@>=4.0.0 <4.3.2": 4.3.2

auditConfig:
  ignoreGhsas:
    # extract-zip symlink path traversal: the advisory lists >=2.0.2 as patched,
    # but no release after 2.0.1 exists on npm, so there is nothing to pin to.
    # Dev-only path (pa11y-ci > puppeteer > @puppeteer/browsers). Remove this
    # exception once extract-zip publishes a fixed release.
    - GHSA-jmr9-qjv8-65gv
    # extract-zip arbitrary file writes through symlink archive entries: the
    # same package, the same dev-only path, and the same absence of anywhere to
    # go. This one records no patched version at all, and 2.0.1 is still the
    # last release published. Both exceptions retire together, on the release
    # that fixes either.
    - GHSA-7pqw-9j4j-h8q3

peerDependencyRules:
  allowedVersions:
    typescript: ">=6.0.0"

# TypeScript stays on 6.x, and the caret in package.json is not the reason: a
# dependency sweep that reaches for the latest will take 7 and the site will
# still build, because what breaks is the gate rather than the build.
# `astro check`, which `pnpm run lint` runs first and CI runs as Site lint,
# refuses outright: "The TypeScript module loaded (found 7.0.2) does not expose
# the programmatic API that astro check relies on. TypeScript's native compiler
# (7.0 and later) does not ship this API yet." Tracked upstream at
# https://github.com/withastro/roadmap/discussions/1321; raise the floor when
# that lands, and not before.

allowBuilds:
  esbuild: true
  puppeteer: true
  sharp: true

# Disable the supply-chain release-age gate so dependencies always resolve to
# the latest published versions (pnpm 11.8 applies a non-zero default otherwise).
minimumReleaseAge: 0
