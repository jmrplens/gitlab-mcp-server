packages:
  - .

overrides:
  esbuild: 0.28.1
  lodash: 4.18.1
  yaml: 2.9.0
  yaml-language-server@1.20.0>yaml: 2.9.0
  # brace-expansion ReDoS (GHSA-3jxr-9vmj-r5cp); dev/build deps only.
  "brace-expansion@<1.1.16": 1.1.16
  "brace-expansion@>=3.0.0 <5.0.7": 5.0.7
  # fast-uri host confusion via failed IDN / backslash authority
  # (GHSA-4c8g-83qw-93j6, GHSA-v2hh-gcrm-f6hx); dev/build deps only (serve>ajv).
  "fast-uri@<3.1.4": ">=3.1.4"

peerDependencyRules:
  allowedVersions:
    typescript: ">=6.0.0"

allowBuilds:
  esbuild: true
  puppeteer: true
  sharp: true

# Disable the supply-chain release-age gate so dependencies always resolve to
# the latest published versions (pnpm 11.8 applies a non-zero default otherwise).
minimumReleaseAge: 0
