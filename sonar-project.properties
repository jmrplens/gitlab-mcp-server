# SonarCloud Configuration for gitlab-mcp-server
# This file configures rule exclusions for Go-specific patterns that SonarCloud
# flags incorrectly or too aggressively.

sonar.projectKey=jmrplens_gitlab-mcp-server
sonar.organization=jmrplens
sonar.projectName=gitlab-mcp-server

# Source and test directories
#
# internal/testutil is test code that does not happen to be named _test.go. It
# is compiled into test binaries only, nothing under cmd/ or internal/ imports
# it outside a test, and it exists to be called from them. Counted as a source
# it asks for coverage of helpers whose only callers are tests, which is how a
# guard that fires on no supported platform reads as a coverage regression.
sonar.sources=cmd,internal
sonar.tests=cmd,internal
sonar.test.inclusions=**/*_test.go,internal/testutil/**

# Coverage report (generated by CI)
sonar.go.coverage.reportPaths=coverage.out

# Nothing is excluded from coverage. The profile CI uploads already spans both
# roots (`go test -coverpkg=./cmd/...,./internal/...`), so the number Sonar
# reports is the number for the whole repository, `cmd/` development and audit
# utilities included.
#
# This used to exclude `cmd/**` on the grounds that those utilities are
# validated through generated artifacts and CLI runs rather than unit tests.
# That reasoning made the headline coverage figure describe `internal/` while
# appearing to describe the project, and it removed any pressure to test 26,000
# statements of tooling that the release chain depends on. They are tested now.
#
# It also excluded `internal/autoupdate/exec_unix.go` and `exec_windows.go`,
# which no longer exist: the self-updater was removed.
#
# `internal/testutil/**` is harness code that cannot carry the `_test.go`
# suffix, because such a file is not importable from another package. It is
# linked into no binary, and its uncovered lines are the `t.Fatalf` arms that
# fire only when the harness itself misbehaves. It is counted anyway rather
# than argued about: a harness the tests lean on this heavily is worth
# measuring.

# Exclude non-code files that SonarQube cannot parse (e.g. VERSION triggers
# the C/C++ analyzer with "Expected unqualified-id").
#
# testdata is excluded for the reason the Go toolchain excludes it: it holds
# fixtures, not program code. cmd/server/testdata/peer is a program a test
# builds and runs as a stand-in process, so it is never linked into a test
# binary and can never be covered by one.
sonar.exclusions=VERSION,**/testdata/**

# Copy-Paste Detection (CPD) exclusions — GENUINELY-IRREDUCIBLE duplication only.
#
# Policy note: zero import cycles (ADR-0004) do NOT by themselves force
# duplication — sub-packages cannot import each other but they all CAN import
# internal/toolutil. Wherever two packages mirrored a byte-identical output
# *shape* or converter, the canonical copy now lives in toolutil and both
# packages reference it (DEDUP-001/DEDUP-002). Those files are therefore NOT
# excluded here.
#
# The exclusions below cover the one class that Go genuinely cannot deduplicate
# without reflection or verbose field-accessor generics (both of which would HURT
# maintainability): code that maps an identical input/value set onto DISTINCT
# GitLab SDK types. Go has no structural typing, so the field-assignment block
# cannot be shared across the distinct types.
#
#   - groups/push_rules.go vs projects/projects.go: identical push-rule converter
#     and apply-options logic over gl.GroupPushRules/AddGroupPushRuleOptions vs
#     gl.ProjectPushRules/AddProjectPushRuleOptions (the shared PushRuleOutput
#     shape is extracted; only the per-SDK-type adapters remain).
#   - issues/issues.go: identical list-filter mapping onto gl.ListProjectIssuesOptions
#     vs gl.ListGroupIssuesOptions vs gl.ListIssuesOptions.
#   - groupsaml / groupldap / container-registry: parallel REST surfaces whose
#     metadata builders and SDK-typed adapters cannot be merged across packages.
#
# mapping.go (DOC-002 audit_doc_coverage): routing data tables. docOwnershipRules
# holds 14 per-doc entries, each with a unique set of Groups/Prefixes slices that
# enumerate which catalog tools each docs/tools/<doc>.md claims. The strings inside
# each slice are *unique per doc* (each doc claims a distinct set of tools), but
# every entry shares the same `{Groups: []string{...}, Prefixes: []string{...}}`
# shape — SonarCloud CPD flags the shape similarity as duplication even though the
# underlying data is unique. Extracting the data to an external JSON/YAML file
# would add loader+parser complexity (init-time read, error paths, regeneration)
# without reducing the data's per-doc uniqueness, so the irreducibility is
# inherent to "data that has to live next to the routing code that consumes it".
#
# internal/tools/*/action_specs.go (glob): per-domain discovery-metadata
# catalogs (usage/aliases/related/parameter guidance per action) — the same
# data-table class as mapping.go. SonarCloud CPD normalizes string literals, so
# two actions whose guidance entries share the {SemanticRole, ValueSource,
# ExampleBinding, CommonConfusions} struct shape are flagged as duplicates even
# when every string is unique to the action. The guidance text that CAN be
# shared verbatim is already extracted into helpers
# (toolutil.DiscussionIDParamGuidance, toolutil.DiscussionNoteIDParamGuidance,
# invites' inviteGuidance); what remains is per-action data whose quality is
# policed by cmd/audit_discovery_completeness and the audit_1to1 R-META
# auditor, not by copy-paste detection. This glob subsumes the previous
# groupsaml/groupldap action_specs entries.
#
# Additional distinct-SDK-type cases (same class as push_rules.go/issues.go).
# Each file below was inspected individually; the verbatim-shareable parts have
# already been extracted to toolutil (member/board/user shapes, guidance
# helpers, GraphQL note mutations, file/base64 upload source, last-pipeline
# shape, PAT shape) and what remains is field-assignment or option mapping
# onto DISTINCT SDK types, or per-surface input schemas whose jsonschema
# descriptions legitimately differ:
#   - accesstokens/accesstokens.go: identical token converters and list-filter
#     mapping onto gl.ProjectAccessToken / gl.GroupAccessToken /
#     gl.PersonalAccessToken and their three distinct list-options structs (the
#     shared date filters are already extracted into applyAccessTokenDateFilters).
#   - group/project/snippet storage moves: three parallel REST surfaces over
#     distinct SDK services (GroupRepositoryStorageMove /
#     ProjectRepositoryStorageMove / SnippetRepositoryStorageMove) with
#     per-domain hint strings.
#   - milestones.go vs groupmilestones.go: identical create/update option
#     mapping onto gl.CreateMilestoneOptions/gl.UpdateMilestoneOptions vs the
#     distinct gl.CreateGroupMilestoneOptions/gl.UpdateGroupMilestoneOptions.
#   - environments.go / files.go / broadcastmessages.go: identical option
#     mapping in Create vs Edit/Update handlers onto the distinct Create*/
#     Edit*/Update* SDK options structs.
#   - usagedata.go: identical field mirror onto two distinct SDK metadata
#     structs (service ping / usage data).
#   - groupvariables.go vs instancevariables.go: identical variable filter and
#     option mapping onto distinct group/instance SDK options structs.
#   - users/user_misc.go vs runners/runners.go: identical runner option
#     mapping onto gl.CreateUserRunnerOptions vs gl.RegisterNewRunnerOptions.
#   - mrdiscussions/mr_discussions.go vs mrdraftnotes/mr_draft_notes.go (and
#     the mrnotes/mr_notes.go Update prologue): per-surface DiffPosition input
#     schemas whose jsonschema descriptions and LineRange semantics differ by
#     design, plus validation prologues that differ only in op/hint literals
#     (CPD normalizes string literals, so unique per-tool text still matches).
#   - epics.go / epicissues/epic_issues.go: converter tails onto distinct epic
#     SDK types and assign/unassign prologues differing only in op literals.
#   - issuestatistics.go: group vs project statistics option structs built
#     from one shared parameter struct (the issues.go class).
#   - labels.go vs grouplabels.go: list/get scaffolding over the distinct
#     Labels vs GroupLabels SDK services.
#   - securityfindings.go vs vulnerabilities.go: identical location
#     normalization from distinct per-domain GraphQL node types.
sonar.cpd.exclusions=internal/tools/groupsaml/groupsaml.go,internal/tools/*/action_specs.go,internal/tools/containerregistry/markdown.go,internal/tools/groups/push_rules.go,internal/tools/issues/issues.go,cmd/audit_doc_coverage/mapping.go,internal/tools/accesstokens/accesstokens.go,internal/tools/groupstoragemoves/group_storage_moves.go,internal/tools/projectstoragemoves/project_storage_moves.go,internal/tools/snippetstoragemoves/snippet_storage_moves.go,internal/tools/milestones/milestones.go,internal/tools/groupmilestones/groupmilestones.go,internal/tools/environments/environments.go,internal/tools/files/files.go,internal/tools/broadcastmessages/broadcastmessages.go,internal/tools/usagedata/usagedata.go,internal/tools/groupvariables/groupvariables.go,internal/tools/instancevariables/instancevariables.go,internal/tools/users/user_misc.go,internal/tools/runners/runners.go,internal/tools/mrdiscussions/mr_discussions.go,internal/tools/mrdraftnotes/mr_draft_notes.go,internal/tools/mrnotes/mr_notes.go,internal/tools/epics/epics.go,internal/tools/epicissues/epic_issues.go,internal/tools/issuestatistics/issuestatistics.go,internal/tools/labels/labels.go,internal/tools/grouplabels/grouplabels.go,internal/tools/securityfindings/securityfindings.go,internal/tools/vulnerabilities/vulnerabilities.go

# =============================================================================
# Rule Exclusions for Test Files
# =============================================================================
# These rules are suppressed in test files because they conflict with idiomatic
# Go test patterns.

# S1192: "Define a constant instead of duplicating this literal"
# In Go test files, table-driven tests and httptest mocks deliberately repeat
# string literals (API paths, URLs, error messages, test data) for readability.
# Extracting every repeated literal into a constant harms test clarity without
# meaningful quality improvement.
#
# S1186: "Add a nested comment explaining why this function is empty"
# Empty function bodies in httptest handler mocks are intentional — they simulate
# HTTP 200 OK responses. This is standard Go httptest practice:
#   http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {})
#
# S100: "Rename function to match the regular expression"
# Go test names use underscores by convention (TestFoo_Bar_Baz). This is the
# standard Go testing pattern documented at https://go.dev/doc/code#Testing.
# SonarQube's regex ^(_|[a-zA-Z0-9]+)$ does not accommodate Go conventions.
#
# S3776: "Refactor this method to reduce its Cognitive Complexity"
# Test helper functions that verify multiple fields of API responses naturally
# have higher complexity. Splitting them reduces test readability.
sonar.issue.ignore.multicriteria=t1,t2,t3,t4,g1,g2,g4,g5,g6,g7

# S1192 — duplicated string literals in tests
sonar.issue.ignore.multicriteria.t1.ruleKey=go:S1192
sonar.issue.ignore.multicriteria.t1.resourceKey=**/*_test.go

# S1186 — empty function body in tests (httptest mocks)
sonar.issue.ignore.multicriteria.t2.ruleKey=go:S1186
sonar.issue.ignore.multicriteria.t2.resourceKey=**/*_test.go

# S100 — function naming (Go test names use underscores)
sonar.issue.ignore.multicriteria.t3.ruleKey=go:S100
sonar.issue.ignore.multicriteria.t3.resourceKey=**/*_test.go

# S3776 — cognitive complexity in test helpers
sonar.issue.ignore.multicriteria.t4.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.t4.resourceKey=**/*_test.go

# =============================================================================
# Rule Exclusions — Global (all Go files)
# =============================================================================

# S1135: "Complete the task associated to this TODO comment"
# TODO and FIXME annotations are standard practice in all codebases including
# Go's own standard library. They serve as tracking mechanisms, not quality
# issues. Project uses ticket references in TODOs for tracking.
sonar.issue.ignore.multicriteria.g1.ruleKey=go:S1135
sonar.issue.ignore.multicriteria.g1.resourceKey=**/*.go

# S3776: "Refactor this method to reduce its Cognitive Complexity"
# Go option-builder functions that map input struct fields to API option structs
# use many `if field != zero { opts.Field = value }` branches. Each branch is a
# trivial null-check + assignment, but the sum exceeds the threshold of 15.
# This is idiomatic Go for configuration/options building (see Go stdlib
# http.Server, tls.Config, etc.). Refactoring into sub-functions harms
# readability without improving maintainability.
sonar.issue.ignore.multicriteria.g2.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.g2.resourceKey=**/*.go

# S4830 / S5527: "Enable server certificate / hostname validation on this SSL/TLS
# connection". The two call sites set tls.Config.InsecureSkipVerify = true ONLY
# when the user explicitly opts in via the GITLAB_SKIP_TLS_VERIFY environment
# variable, which exists to support self-hosted GitLab instances using
# self-signed certificates in development environments. This is documented user
# behavior, gated by a config flag, and already annotated with //#nosec G402
# and //nolint:gosec in source. Sonar does not honor those Go-tooling pragmas,
# so these two file paths are excluded explicitly.
sonar.issue.ignore.multicriteria.g4.ruleKey=go:S4830
sonar.issue.ignore.multicriteria.g4.resourceKey=**/oauth/verifier.go

sonar.issue.ignore.multicriteria.g5.ruleKey=go:S5527
sonar.issue.ignore.multicriteria.g5.resourceKey=**/oauth/verifier.go

sonar.issue.ignore.multicriteria.g6.ruleKey=go:S4830
sonar.issue.ignore.multicriteria.g6.resourceKey=**/gitlab/client.go

sonar.issue.ignore.multicriteria.g7.ruleKey=go:S5527
sonar.issue.ignore.multicriteria.g7.resourceKey=**/gitlab/client.go

